<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔式光热电站 · 定日镜3D科学演示</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  #app { display: flex; width: 100vw; height: 100vh; }

  /* ---------- 中间：3D 主图 ---------- */
  #sceneWrap { flex: 1; position: relative; height: 100%; background: #cfeaf8; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #scene:active { cursor: grabbing; }
  #hint { position: absolute; left: 14px; bottom: 12px; font-size: 12px; color: #33688f; background: rgba(255,255,255,.72); border-radius: 6px; padding: 4px 10px; pointer-events: none; }
  /* 垂直视角滑杆（3D 区内浮动） */
  #elvCtl { position: absolute; left: 14px; bottom: 44px; display: flex; align-items: center; gap: 7px; background: rgba(255,255,255,.82); border: 1px solid #b9d4e6; border-radius: 8px; padding: 5px 10px; box-shadow: 0 2px 8px rgba(30,80,130,.15); z-index: 10; }
  #elvCtl label { font-size: 12px; color: #175a8e; white-space: nowrap; }
  #elvCtl input[type=range] { width: 150px; accent-color: #1a7bd0; }
  #elvCtl .val { min-width: 40px; }

  /* ---------- 右侧固定平面区 ---------- */
  #rightPanel { width: 452px; min-width: 452px; height: 100%; background: #f2f9fd; border-left: 1px solid #cfe0ee; display: flex; flex-direction: column; padding: 8px 10px; gap: 6px; overflow-y: auto; }
  .panel { background: #fff; border-radius: 10px; box-shadow: 0 3px 10px rgba(30,80,130,.15); padding: 6px 10px; font-size: 12px; color: #234; }
  .panel h2 { font-size: 13px; color: #1a5b96; border-left: 4px solid #f5b301; padding-left: 6px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; }
  .panel h1 { font-size: 14px; color: #1a5b96; letter-spacing: .5px; }
  .panel .sub { font-size: 10px; color: #6a8aa4; margin: 1px 0 3px; }
  #ctrl { flex: none; }
  #planCard { flex: none; }
  #chartPanel { flex: 1; display: flex; flex-direction: column; min-height: 170px; }
  #chart { width: 100%; flex: 1; min-height: 140px; display: block; }

  /* 俯视平面图浮动窗口（放大 2 倍，可拖动到页面任意位置） */
  #app { position: relative; }
  #planFloat { position: absolute; right: 466px; top: 12px; width: 680px; z-index: 30; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(20,60,100,.35); padding: 6px 10px 10px; font-size: 12px; color: #234; }
  #planFloat h2 { font-size: 13px; color: #1a5b96; border-left: 4px solid #f5b301; padding-left: 6px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; }
  #planFloat h2 button, #chartFloat h2 button { pointer-events: auto; }
  #plan { width: 100%; height: 504px; display: block; cursor: pointer; }

  /* 曲线图放大浮动窗口（2 倍，可拖动，原窗口保留） */
  #chartFloat { position: absolute; left: 430px; top: 60px; width: 904px; z-index: 31; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(20,60,100,.35); padding: 6px 10px 10px; font-size: 12px; color: #234; }
  #chartFloat h2 { font-size: 14px; color: #1a5b96; border-left: 4px solid #f5b301; padding-left: 6px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; }
  #chartBig { width: 100%; height: 540px; display: block; }

  /* 曲线图 HTML 图例（每个镜后带仰角/方位角显示复选框） */
  #legend, #legendBig { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; margin-top: 4px; font-size: 11px; color: #234; }
  #legendBig { font-size: 13px; }
  #legendBig input { width: 14px; height: 14px; }
  .lgitem { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .lgline { width: 16px; height: 0; border-top: 3px solid; flex: none; }
  .lgname { font-weight: bold; }
  .lgitem label { cursor: pointer; display: flex; align-items: center; gap: 2px; }
  .lgitem input { accent-color: #1a5b96; margin: 0; }
  #styleNote { font-size: 10px; color: #667788; margin-top: 2px; }

  /* 镜面特写 3D 浮动窗口（位于 3D 区内，默认收起，可拖动） */
  #zoomFold { position: absolute; right: 14px; top: 12px; z-index: 21; }
  #zoomFloat { position: absolute; right: 14px; top: 40px; width: 430px; z-index: 20; background: #fff; border-radius: 10px; box-shadow: 0 6px 24px rgba(20,60,100,.35); padding: 6px 10px 10px; font-size: 12px; color: #234; }
  #zoomFloat h2 { font-size: 13px; color: #1a5b96; border-left: 4px solid #f5b301; padding-left: 6px; margin-bottom: 3px; display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; }
  #zoomFloat h2 button { pointer-events: auto; }
  #zoomTabs { display: flex; gap: 6px; margin: 4px 0 5px; }
  #zoomTabs button { flex: 1; border: 1.5px solid; border-radius: 5px; background: #f4f9fd; font-size: 11px; padding: 3px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #zoomTabs button:disabled { cursor: default; background: #eef1f4; color: #aabbcc !important; border-color: #ccd6df !important; }
  #zoomCanvas { width: 100%; height: 300px; display: block; border-radius: 6px; cursor: grab; }

  /* 控件（紧凑排列，面板高度约为初版 5/6） */
  .row { display: flex; align-items: center; justify-content: space-between; margin: 5px 0; gap: 5px; }
  .row label { color: #345; white-space: nowrap; font-size: 12px; }
  .row2 { display: flex; align-items: center; gap: 6px; margin: 5px 0; }
  .row2 label { color: #345; white-space: nowrap; font-size: 12px; flex: none; }
  select, input[type=number], input[type=date] { border: 1px solid #b9ccdb; border-radius: 4px; padding: 3px 6px; font-size: 12px; color: #234; background: #fff; min-width: 0; }
  input[type=number] { width: 62px; }
  .row2 select, .row2 input[type=date] { flex: 1; }
  input[type=range] { flex: 1; accent-color: #f5a623; height: 16px; }
  .val { min-width: 48px; text-align: center; background: #eef5fb; border: 1px solid #c9dcea; border-radius: 4px; padding: 2px 4px; font-weight: bold; color: #175a8e; font-size: 12px; }
  .btns { display: flex; gap: 6px; margin-top: 6px; }
  .btn { flex: 1; border: none; border-radius: 5px; padding: 5px 0; font-size: 13px; cursor: pointer; color: #fff; }
  .btn.play { background: #2e9e5b; } .btn.pause { background: #d98f00; } .btn.stop { background: #c62828; }
  .foldBtn { border: 1px solid #b9ccdb; background: #f4f9fd; color: #1a5b96; border-radius: 5px; font-size: 11px; padding: 1px 8px; cursor: pointer; }
  .foldBtn:hover { background: #eaf4fc; }
  .readout { display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: #345; gap: 4px; white-space: nowrap; }
  .readout b { color: #d35400; }
  #selInfo { margin: 6px 0; padding: 5px 8px; background: #fff8e0; border: 1px dashed #e0b400; border-radius: 6px; font-size: 12px; color: #7a5b00; line-height: 1.6; }
  #selGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 6px; }
  .selrow { display: flex; align-items: center; gap: 4px; }
  .selrow .tag { width: 18px; height: 0; border-top: 3px solid; flex: none; }
  .selrow label { font-size: 12px; flex: none; }
  .selrow select { flex: 1; padding: 3px 4px; font-size: 12px; min-width: 0; }
</style>
</head>
<body>
<div id="app">

  <!-- ===== 中间 3D 主图 ===== -->
  <div id="sceneWrap">
    <canvas id="scene"></canvas>
    <div id="elvCtl"><label>垂直视角</label><input type="range" id="elvSlider" min="-15" max="90" step="1" value="34"><span class="val" id="elvVal">34°</span></div>
    <button class="foldBtn" id="zoomFold">镜面特写 &#9654;</button>
    <div id="zoomFloat" style="display:none">
      <h2>定日镜运动特写 <span><button class="foldBtn" id="zoomClose">收起 &#9650;</button></span></h2>
      <div id="zoomTabs"></div>
      <canvas id="zoomCanvas"></canvas>
    </div>
    <div id="hint">黄色光线为平行入射与反射聚光光路 · 太阳位置按 NOAA 天文算法计算（高度角&ge;10°定日镜工作）· 点击镜面将其加入右侧曲线</div>
  </div>

  <!-- ===== 俯视平面图浮动窗口（展开时显示，不占右侧面板高度） ===== -->
  <div id="planFloat" style="display:none">
    <h2>俯视平面图 <span><span style="font-size:10px;color:#6a8aa4">点击镜面加入对比</span> <button class="foldBtn" id="planClose">收起 &#9650;</button></span></h2>

  <!-- ===== 右侧固定平面区：设置(顶) + 俯视平面图(可折叠) + 日变化曲线 ===== -->

    <!-- 演示设置（固定显示在最上方，紧凑排列） -->

      <div class="row2"><label>地点</label>
        <select id="city">
          <option value="93.5,42.8">新疆·哈密</option>
          <option value="116.4,39.9">北京</option>

        <div class="selrow"><span class="tag" style="border-color:#e8821e"></span><label>镜2</label><select id="sel1"></select></div>

    <!-- 俯视平面图（默认折叠，展开为浮动窗口） -->
    <div class="panel" id="planCard">
      <h2>俯视平面图 <button class="foldBtn" id="planFold">展开 &#9660;</button></h2>

    <!-- 日变化曲线 -->
    <div class="panel" id="chartPanel">
      <h2>定日镜仰角与方位角日变化 <button class="foldBtn" id="chartZoom">放大 &#9974;</button></h2>

      <div id="legend"></div>
      <div id="styleNote">实线＝仰角(左轴°)　－ 虚线＝方位角(右轴°)　浅色虚线段＝停用时段</div>
    </div>

</div>

<!-- ===== 曲线图放大浮动窗口（2 倍，可拖动，原窗口保留） ===== -->
<div id="chartFloat" style="display:none">
  <h2>定日镜仰角与方位角日变化（放大）<span><button class="foldBtn" id="chartFloatClose">还原 &#9660;</button></span></h2>
  <canvas id="chartBig"></canvas>
  <div id="legendBig"></div>
  <div id="styleNote">实线＝仰角(左轴°)　－ 虚线＝方位角(右轴°)　浅色虚线段＝停用时段</div>
</div>

<script>
"use strict";
const D2R = Math.PI/180, R2D = 180/Math.PI;
const WORK_MIN = 10;               // 工作最低太阳高度角
const TOWER_H = 52.5, REC_H = 7;   // 塔高（已放大 1.75 倍）
const REC_CENTER = TOWER_H + REC_H*0.5;   // 吸热器中心（所有反射光线的汇聚点）
const MIRROR_H = 3.85;             // 镜面离地高度（放大 1.75 倍）
const SUN_HS = 1.75;               // 太阳屏幕高度放大倍数
const MW = 9, ML = 6.5;            // 镜面尺寸
/* 定日镜支架几何（参照真实模型：喇叭底座 → 白立柱 → 灰头部箱 → 关节颈柱 + 圆球 → 镜板）
   尺寸已整体缩细 1/8（×7/8）；头部箱深度方向与镜面法线对齐且 ≤ 镜面厚度 0.4，侧视图不超出镜面 */
const PED = {
  baseR0: 0.56, baseR1: 0.294, baseH: 0.45,  // 喇叭形底座：下宽上窄
  postR: 0.21, postTop: 1.75,                // 立柱底部半径（立柱由下向上渐细）
  boxZ0: 1.75, boxZ1: 2.9,                   // 立柱分段参考高度（与上下段连续）
  neckR: 0.21, ballZ: 3.5, ballR: 0.14,      // 圆球半径（缩小1/2）；立柱顶部半径渐变到球半径
  sliceH: 0.25,                              // 支架遮挡判定的 z 切片高度
  cols: 4, rows: 3,                          // 镜板网格分片
};
// 立柱半径：由下向上逐渐缩小，顶端等于圆球半径
const colR = z => PED.postR + (PED.ballR - PED.postR)*(z - PED.baseH)/(PED.ballZ - PED.baseH);
const norm = v => { const l = Math.hypot(v[0],v[1],v[2])||1; return [v[0]/l,v[1]/l,v[2]/l]; };
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

/* ============ 定日镜阵列：内/中/外三圈 ============ */
const RINGS = [
  { r: 55,  n: 10, name: '内圈' },
  { r: 85,  n: 16, name: '中圈' },
  { r: 115, n: 22, name: '外圈' },
];
const mirrors = [];
RINGS.forEach((ring, ri) => {
  for (let i = 0; i < ring.n; i++) {
    const az = (i / ring.n) * 360 + (ri * 11);
    const a = az * D2R;
    mirrors.push({ id: `${ring.name}-${i+1}号`, ring: ri, x: ring.r*Math.sin(a), y: ring.r*Math.cos(a) });
  }
});

/* ============ 状态 ============ */
const SEL_COLORS = ['#1565c0', '#e8821e', '#2e9e5b', '#9c27b0'];   // 4 个定日镜的颜色
const state = {
  lon: 101.8, lat: 36.6, date: '2026-06-21',
  timeMin: 600,
  viewAzi: 190, viewElv: 21, zoom: 1,   // 默认视角：南侧偏东、垂直视角 21°（东在左、西在右、北在远上方）
  playing: false,
  sel: [47, null, null, null], // 默认只选择镜1（外圈-22号），镜2/3/4 为未选择状态（null）
  selSlot: 0,                  // 场景点击时轮换写入的槽位
  showElv: [true, true, true, true],    // 每镜仰角曲线显示开关（默认勾选）
  showAzi: [false, false, false, false] // 每镜方位角曲线显示开关（默认不勾选）
};
// 默认使用终端当前日期与时间
(function () {
  const now = new Date(), pad = n => String(n).padStart(2, '0');
  state.date = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  state.timeMin = now.getHours()*60 + now.getMinutes();
  const dEl = document.getElementById('date'), tEl = document.getElementById('time');
  if (dEl) dEl.value = state.date;
  if (tEl) tEl.value = state.timeMin;
})();

/* ============ 天文计算：NOAA 太阳位置算法（NOAA Solar Calculator，基于 Meeus 天文公式） ============ */
// 儒略日：dateStr 为日期，clockMin 为北京时间(UTC+8)分钟数
function julianDay(dateStr, clockMin) {
  const d = new Date(dateStr + 'T00:00:00Z');
  return d.getTime()/86400000 + 2440587.5 + (clockMin/60 - 8)/24;
}
// 返回 {decl:太阳直射点纬度°, elv:太阳高度角°(含大气折射修正), azi:太阳方位角°(北=0顺时针), s:单位方向向量[x东,y北,z上], solarT:真太阳时分钟}
function solarPosition(dateStr, clockMin, latDeg, lonDeg) {
  const jd = julianDay(dateStr, clockMin);
  const T = (jd - 2451545.0) / 36525;
  // 几何平均黄经 / 平近点角 / 地球轨道偏心率
  const L0 = (280.46646 + 36000.76983*T + 0.0003032*T*T) % 360;
  const M = 357.52911 + 35999.05029*T - 0.0001537*T*T;
  const e = 0.016708634 - 0.000042037*T - 0.0000001267*T*T;
  // 太阳中心差 → 真黄经 → 视黄经
  const C = (1.914602 - 0.004817*T - 0.000014*T*T)*Math.sin(M*D2R)
          + (0.019993 - 0.000101*T)*Math.sin(2*M*D2R) + 0.000289*Math.sin(3*M*D2R);
  const appLong = L0 + C - 0.00569 - 0.00478*Math.sin((125.04 - 1934.136*T)*D2R);
  // 黄赤交角（修正）
  const eps = (23 + (26 + (21.448 - 46.815*T - 0.00059*T*T + 0.001813*T*T*T)/60)/60)
            + 0.00256*Math.cos((125.04 - 1934.136*T)*D2R);
  const decl = Math.asin(Math.sin(eps*D2R)*Math.sin(appLong*D2R)) / D2R;   // 太阳直射点纬度
  // 均时差（分钟）
  const y = Math.tan(eps*D2R/2)**2;
  const EqTime = 4*( y*Math.sin(2*L0*D2R)
    - 2*e*Math.sin(M*D2R)
    + 4*e*y*Math.sin(M*D2R)*Math.cos(2*L0*D2R)
    - 0.5*y*y*Math.sin(4*L0*D2R)
    - 1.25*e*e*Math.sin(2*M*D2R) );
  // 真太阳时 → 时角（儒略日 x.0=正午、x.5=午夜，故 +0.5 换算为自午夜起的分钟数）
  const minutesUTC = ((jd + 0.5) % 1) * 1440;
  const trueSolar = minutesUTC + EqTime + 4*lonDeg;
  const HA = (trueSolar/4 - 180) * D2R;
  const lat = latDeg*D2R, d = decl*D2R;
  // 太阳天顶角 → 高度角，NOAA 大气折射修正
  const cosZ = Math.min(1, Math.max(-1, Math.sin(lat)*Math.sin(d) + Math.cos(lat)*Math.cos(d)*Math.cos(HA)));
  let elv = 90 - Math.acos(cosZ)/D2R;
  if (elv > 5) {
    const te = Math.tan((elv + 10.3/(1 + 5.11/(elv + 5.64)))*D2R);
    elv += 58.1/te/60;
  } else if (elv > -0.575) {
    const te = Math.tan((elv + 10.3/(1 + 5.11/(elv + 5.64)))*D2R);
    elv += Math.max(0, 1735 - 518.2*te + 103.4*te*te - 12.79*te*te*te + 0.711*te**4)/3600;
  }
  // 方位角（自正北顺时针）
  let azi = (Math.atan2(Math.sin(HA), Math.cos(HA)*Math.sin(lat) - Math.tan(d)*Math.cos(lat))/D2R + 180) % 360;
  if (azi < 0) azi += 360;
  const s = [Math.sin(azi*D2R)*Math.cos(elv*D2R), Math.cos(azi*D2R)*Math.cos(elv*D2R), Math.sin(elv*D2R)];
  return { decl, elv, azi, s, solarT: trueSolar % 1440 };
}
function sunState() {
  const r = solarPosition(state.date, state.timeMin, state.lat, state.lon);
  return { ...r, working: r.elv >= WORK_MIN };
}

/* ============ 镜面实时姿态：按平面镜反射定律解算 ============ */
// 入射光方向 = -s（s 为指向太阳的单位向量，太阳在无穷远 → 所有入射光平行）
// 期望反射光方向 = t（镜面中心 → 吸热器中心）
// 由反射定律 R = I - 2(I·n)n 反解，法线 n 必为 (s + t) 的单位角平分线：
//   把 n = (s+t)/|s+t| 代入 R = -s + 2(s·n)n，得 R = t  → 反射光精确命中吸热器中心
function frontNormal(s, t) {
  return norm([s[0]+t[0], s[1]+t[1], s[2]+t[2]]);
}
// 反射：入射方向 I（传播方向）与法线 n → 反射传播方向
function reflectDir(I, n) {
  const d = I[0]*n[0] + I[1]*n[1] + I[2]*n[2];
  return [I[0]-2*d*n[0], I[1]-2*d*n[1], I[2]-2*d*n[2]];
}
function mirrorPose(m, ss) {
  const T = [0, 0, REC_CENTER];
  const M = [m.x, m.y, MIRROR_H];
  const t = norm([T[0]-M[0], T[1]-M[1], T[2]-M[2]]);
  if (!ss.working) return null;
  if (Math.hypot(ss.s[0]+t[0], ss.s[1]+t[1], ss.s[2]+t[2]) < 1e-3) return null;
  const n = frontNormal(ss.s, t);
  return { n, t, tilt: Math.asin(Math.max(-1,Math.min(1,n[2])))*R2D,
           face: (Math.atan2(n[0],n[1])*R2D + 360) % 360 };
}
function poseAt(mIdx, clockMin) {
  const ss = solarPosition(state.date, clockMin, state.lat, state.lon);
  const elv = ss.elv;
  if (elv < WORK_MIN) return { tilt: NaN, face: NaN, elv };
  const m = mirrors[mIdx];
  const T = [0,0,REC_CENTER], M = [m.x, m.y, MIRROR_H];
  const t = norm([T[0]-M[0], T[1]-M[1], T[2]-M[2]]);
  if (Math.hypot(ss.s[0]+t[0], ss.s[1]+t[1], ss.s[2]+t[2]) < 1e-3) return { tilt: NaN, face: NaN, elv };
  const n = frontNormal(ss.s, t);
  return { tilt: Math.asin(Math.max(-1,Math.min(1,n[2])))*R2D,
           face: (Math.atan2(n[0],n[1])*R2D + 360) % 360, elv };
}

/* ============ 3D 投影 ============ */
let camPos = [0, 0, 0];   // 当前相机世界坐标（用于判断看到镜面正面还是背面）
function makeProjector(W, H) {
  const th = state.viewAzi*D2R, el = state.viewElv*D2R;
  const d = [-Math.cos(el)*Math.sin(th), -Math.cos(el)*Math.cos(th), -Math.sin(el)];
  const r = [ Math.cos(th), -Math.sin(th), 0];
  const u = [-Math.sin(el)*Math.sin(th), -Math.sin(el)*Math.cos(th), Math.cos(el)];
  // 相机始终位于镜场之外（dist > 外圈半径115），任意视角下都呈经典的近大远小透视
  const dist = 200, C = [-d[0]*dist, -d[1]*dist, -d[2]*dist + 8];
  camPos = C;
  const cx = W*0.5, cy = H*0.56, K = state.zoom * Math.min(W,H)/170, F = 230;
  return P => {
    const px = P[0]-C[0], py = P[1]-C[1], pz = P[2]-C[2];
    const dep = Math.max(px*d[0]+py*d[1]+pz*d[2], 10);
    const k = K*F/(F+dep);
    return { x: cx + (px*r[0]+py*r[1]+pz*r[2])*k, y: cy - (px*u[0]+py*u[1]+pz*u[2])*k, dep, k };
  };
}
function sunScreen(ss, W, H) {
  const K = Math.min(W, H) * 0.46;
  const th = state.viewAzi*D2R, el = state.viewElv*D2R;
  const r = [Math.cos(th), -Math.sin(th), 0];
  const u = [-Math.sin(el)*Math.sin(th), -Math.sin(el)*Math.cos(th), Math.cos(el)];
  return { x: W*0.5 + (ss.s[0]*r[0]+ss.s[1]*r[1]+ss.s[2]*r[2])*K,
           y: H*0.56 - (ss.s[0]*u[0]+ss.s[1]*u[1]+ss.s[2]*u[2])*K*SUN_HS };
}

/* ============ 3D 主图：吸热塔 + 全部定日镜 + 太阳 + 全部光线 + 影子 ============ */
let hitList = [];
const hexShade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const c = v => Math.max(0, Math.min(255, Math.round(v * f)));
  return `rgb(${c((n>>16)&255)},${c((n>>8)&255)},${c(n&255)})`;
};
// 真实透视圆柱/圆台：上下端面圆环按真 3D 圆采样投影（椭圆形状随视角变化），
// 侧面用条带逼近并按太阳方向着色；端面仅当相机位于其外侧时才绘制（不透视底部）
function drawCyl3D(ctx, P, x, y, r0, r1, z0, z1, sideHex, capHex0, capHex1, sunH, N) {
  N = N || 44;
  const rim = (r, z) => {
    const a = [];
    for (let i = 0; i < N; i++) {
      const t = i/N*2*Math.PI;
      a.push(P([x + r*Math.sin(t), y + r*Math.cos(t), z]));
    }
    return a;
  };
  const B = rim(r0, z0), T = rim(r1, z1);
  // 侧面条带（相邻两点 + 上下端环构成四边形），按世界朝向与太阳的水平方向夹角着色
  for (let i = 0; i < N; i++) {
    const j = (i+1) % N, t = i/N*2*Math.PI;
    let f = 0.85;
    if (sunH) f = 0.7 + 0.3*Math.max(0, Math.sin(t)*sunH[0] + Math.cos(t)*sunH[1]);
    ctx.beginPath();
    ctx.moveTo(B[i].x, B[i].y); ctx.lineTo(B[j].x, B[j].y);
    ctx.lineTo(T[j].x, T[j].y); ctx.lineTo(T[i].x, T[i].y);
    ctx.closePath();
    ctx.fillStyle = hexShade(sideHex, f); ctx.fill();
  }
  // 端面：圆盘多边形（其投影形状随视角真实变化），只画相机可见且指定了颜色的端面
  // capHex 为 null 表示该端面不对外可见（连续柱面），跳过绘制，避免残留圆环
  const camZ = camPos[2];
  const cap = (pts, hex, edge) => {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath();
    ctx.fillStyle = hex; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = 1.1; ctx.stroke();
  };
  if (camZ > z1 && capHex1)      cap(T, capHex1, 'rgba(90,110,125,.75)');   // 相机在顶面之上 → 看到顶面
  else if (camZ < z0 && capHex0) cap(B, capHex0, 'rgba(90,110,125,.75)');   // 相机在底面之下 → 看到底面
  // 相机介于两端面之间时两个端面都不可见（侧面遮挡），不画端面
}
// 头部箱体（偏航对齐镜面朝向）：wHalf 沿镜面宽度方向、dHalf 沿镜面法线水平方向；
// 按世界法线剔除背面，仅绘制朝向相机的面；侧面按太阳水平方向着色
function drawBox3D(ctx, P, cx, cy, z0, z1, wHalf, dHalf, yawD2R, colTop, colSide, sunH) {
  const wx = Math.cos(yawD2R), wy = -Math.sin(yawD2R);   // 宽度方向（镜面平面内水平）
  const dx2 = Math.sin(yawD2R), dy2 = Math.cos(yawD2R);  // 深度方向（镜面法线水平）
  const wpt = (sw, sd, z) => [cx + wx*sw*wHalf + dx2*sd*dHalf, cy + wy*sw*wHalf + dy2*sd*dHalf, z];
  const cpt = (sw, sd, z) => P(wpt(sw, sd, z));
  const b = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([s1,s2]) => cpt(s1,s2,z0));
  const t = [[-1,-1],[1,-1],[1,1],[-1,1]].map(([s1,s2]) => cpt(s1,s2,z1));
  const face = (pts, hex) => {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
    ctx.closePath(); ctx.fillStyle = hex; ctx.fill();
    ctx.strokeStyle = 'rgba(55,65,78,.55)'; ctx.lineWidth = 1; ctx.stroke();
  };
  if (camPos[2] < z0) face(b, hexShade(colSide, 0.72));            // 底面（仅相机低于箱底时可见）
  if (camPos[2] > z1) face(t, hexShade(colTop, 1.06));             // 顶面
  // 四个侧面：世界法线朝向相机才绘制，按朝向与太阳水平方向的夹角着色
  const sides = [
    { n: [wx,wy,0],      c: [[1,-1],[1,1]] },
    { n: [-wx,-wy,0],    c: [[-1,-1],[-1,1]] },
    { n: [dx2,dy2,0],    c: [[-1,1],[1,1]] },
    { n: [-dx2,-dy2,0],  c: [[-1,-1],[1,-1]] },
  ];
  sides.forEach(({ n, c }) => {
    const fa = wpt(c[0][0], c[0][1], (z0+z1)/2), fb = wpt(c[1][0], c[1][1], (z0+z1)/2);
    const fc = [(fa[0]+fb[0])/2, (fa[1]+fb[1])/2];
    const vis = (camPos[0]-fc[0])*n[0] + (camPos[1]-fc[1])*n[1] + (camPos[2]-(z0+z1)/2)*n[2] > 0;
    if (!vis) return;
    let f = 0.82;
    if (sunH) f = 0.74 + 0.26*Math.max(0, n[0]*sunH[0] + n[1]*sunH[1]);
    face([cpt(c[0][0],c[0][1],z0), cpt(c[1][0],c[1][1],z0), cpt(c[1][0],c[1][1],z1), cpt(c[0][0],c[0][1],z1)], hexShade(colSide, f));
  });
}
// 镜板网格分片线（cols×rows 分片，参照真实定日镜的小镜片拼接）
// csW: 4 个世界角点 [0]=+a+b [1]=-a+b [2]=-a-b [3]=+a-b；zShift: 厚度向下偏移（背面网格）
function drawMirrorGrid(ctx, P, csW, cols, rows, color, lw, zShift) {
  const lerp = (A, B, t) => [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t];
  const dz = zShift || 0;
  const Pr = p => P([p[0], p[1], p[2]-dz]);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  for (let k = 1; k < cols; k++) {
    const t = k/cols;
    const p1 = Pr(lerp(csW[0], csW[1], t)), p2 = Pr(lerp(csW[3], csW[2], t));
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
  for (let k = 1; k < rows; k++) {
    const t = k/rows;
    const p1 = Pr(lerp(csW[0], csW[3], t)), p2 = Pr(lerp(csW[1], csW[2], t));
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
}
// 定日镜支架段绘制：z0<baseH 时画喇叭底座；立柱为上细下粗的锥形柱（顶部半径渐变到球半径）
function drawPedestalSeg(ctx, P, m, sH, N, z0, z1) {
  // 底座锥形段（按切片区间裁剪，半径随高度线性插值；仅地面端与锥-柱过渡处绘制端盖）
  if (z0 < PED.baseH) {
    const ze = Math.min(z1, PED.baseH);
    const r = t => PED.baseR0 + (PED.baseR1 - PED.baseR0) * (t / PED.baseH);
    const cap0 = z0 < 0.01 ? '#5d646c' : null;
    const cap1 = z1 >= PED.baseH ? '#6a727b' : null;
    drawCyl3D(ctx, P, m.x, m.y, r(z0), r(ze), z0, ze, '#82888f', cap0, cap1, sH, N);
  }
  const a = Math.max(z0, PED.baseH);
  if (z1 > a)
    drawCyl3D(ctx, P, m.x, m.y, colR(a), colR(z1), a, z1, '#e9ebee', null, null, sH, Math.max(8, N-4));
}
// 相机到点 p 的线段是否被该镜的镜面板遮挡（射线与镜面 quad 精确求交）
// 解决低角度背视时支架因单一排序深度被镜面整体误遮挡的问题
// 二维线段与矩形求交（用于镜板厚度区间检测）
function segRectHit(ax, ay, bx, by, hx, hy) {
  if (Math.abs(ax) <= hx && Math.abs(ay) <= hy) return true;
  if (Math.abs(bx) <= hx && Math.abs(by) <= hy) return true;
  const edges = [[-hx,-hy,hx,-hy],[hx,-hy,hx,hy],[hx,hy,-hx,hy],[-hx,hy,-hx,-hy]];
  const dx = bx-ax, dy = by-ay;
  for (const [x1,y1,x2,y2] of edges) {
    const ex = x2-x1, ey = y2-y1;
    const den = dx*ey - dy*ex;
    if (Math.abs(den) < 1e-12) continue;
    const t = ((x1-ax)*ey - (y1-ay)*ex) / den;
    const s = ((x1-ax)*dy - (y1-ay)*dx) / den;
    if (t > 0 && t < 1 && s >= 0 && s <= 1) return true;
  }
  return false;
}
// 相机到点 p 的线段是否被该镜的镜面板（含 0.4 厚度）遮挡
// 对镜板前、后两个面分别求交，得视线在板厚区间内的轨迹段，再与镜面轮廓矩形求交
function segHitsMirrorQuad(m, pose, cam, p) {
  const M = [m.x, m.y, MIRROR_H];
  let n, a1, b1, dBack;
  if (pose) {
    n = pose.n;
    const a1v = cross(n, [0,0,1]);
    a1 = Math.hypot(a1v[0],a1v[1],a1v[2]) < 1e-6 ? [1,0,0] : norm(a1v);
    b1 = norm(cross(n, a1));
    dBack = -0.4 * n[2];                     // 背面沿 -z 偏移板厚在法线方向的投影
  } else {
    n = [0,0,1]; a1 = [1,0,0]; b1 = [0,1,0]; // 停用时镜面水平放置，同样参与遮挡
    dBack = -0.4;
  }
  const dn = (p[0]-cam[0])*n[0] + (p[1]-cam[1])*n[1] + (p[2]-cam[2])*n[2];
  if (Math.abs(dn) < 1e-9) return false;
  const dMid = (M[0]-cam[0])*n[0] + (M[1]-cam[1])*n[1] + (M[2]-cam[2])*n[2];
  let tA = dMid/dn, tB = (dMid + dBack)/dn;  // 前、后面的交点参数
  if (tA > tB) { const t0 = tA; tA = tB; tB = t0; }
  tA = Math.max(tA, 0.02); tB = Math.min(tB, 0.999);   // 须位于相机与目标点之间（上限接近1：支架顶部贴近镜背面时交点 t 可达 0.99+）
  if (tB <= tA) return false;
  const toUV = t => {
    const ix = cam[0]+(p[0]-cam[0])*t - M[0], iy = cam[1]+(p[1]-cam[1])*t - M[1], iz = cam[2]+(p[2]-cam[2])*t - M[2];
    return [ix*a1[0]+iy*a1[1]+iz*a1[2], ix*b1[0]+iy*b1[1]+iz*b1[2]];
  };
  const A = toUV(tA), B = toUV(tB);
  return segRectHit(A[0], A[1], B[0], B[1], MW/2 + 0.2, ML/2 + 0.2);
}
// 关节部分：颈柱切片（锥形连续）与万向节圆球分开绘制，各自参与深度排序
function drawNeckSlice(ctx, P, m, sH, N, z0, z1) {
  drawCyl3D(ctx, P, m.x, m.y, colR(z0), colR(z1), z0, z1, '#e9ebee', null, null, sH, Math.max(8, N-6));
}
// 绘制支架区间 [z0,z1]（自动跨越底座锥段/立柱/颈柱边界）
function drawPedestalSpan(ctx, P, m, sH, N, z0, z1) {
  if (z0 < PED.boxZ1) drawPedestalSeg(ctx, P, m, sH, N, z0, Math.min(z1, PED.boxZ1));
  if (z1 > PED.boxZ1) drawNeckSlice(ctx, P, m, sH, N, Math.max(z0, PED.boxZ1), z1);
}
function drawBall(ctx, P, m) {
  const qb = P([m.x, m.y, PED.ballZ]);
  const rb = Math.max(1.2, PED.ballR*qb.k);
  const gr = ctx.createRadialGradient(qb.x-rb*0.35, qb.y-rb*0.35, rb*0.15, qb.x, qb.y, rb);
  gr.addColorStop(0, '#f0f3f6'); gr.addColorStop(1, '#848c96');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(qb.x, qb.y, rb, 0, 2*Math.PI); ctx.fill();
  ctx.strokeStyle = 'rgba(70,80,92,.6)'; ctx.lineWidth = 1; ctx.stroke();
}
function label(ctx, txt, x, y, lx, ly) {
  ctx.strokeStyle = '#37628c'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(x, y+5); ctx.lineTo(lx, ly); ctx.stroke();
  ctx.font = 'bold 14px "Microsoft YaHei"';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)';
  ctx.strokeText(txt, x, y);
  ctx.fillStyle = '#175a8e'; ctx.fillText(txt, x, y);
}

function drawScene() {
  const wrap = document.getElementById('sceneWrap');
  const cv = document.getElementById('scene');
  const W = wrap.clientWidth, H = wrap.clientHeight, dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);

  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#a8d8ef'); g.addColorStop(0.55,'#c9e9f7'); g.addColorStop(1,'#e3f4fb');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const P = makeProjector(W, H);
  const ss = sunState();

  // ---- 地面大圆台 ----
  const RG = 148;
  ctx.beginPath();
  for (let i=0;i<=90;i++){ const a=i/90*2*Math.PI; const q=P([RG*Math.sin(a),RG*Math.cos(a),0]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }
  ctx.closePath();
  const gg = ctx.createRadialGradient(W*0.5,H*0.56,20, W*0.5,H*0.56,RG*H/300*1.7);
  gg.addColorStop(0,'#bfe0f0'); gg.addColorStop(1,'#9cc8e2');
  ctx.fillStyle = gg; ctx.fill();
  ctx.strokeStyle = '#8fb8d4'; ctx.lineWidth = 2; ctx.stroke();
  [55, 85, 115].forEach(r => {
    ctx.beginPath();
    for (let i=0;i<=72;i++){ const a=i/72*2*Math.PI; const q=P([r*Math.sin(a),r*Math.cos(a),0]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }
    ctx.closePath(); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.4; ctx.stroke();
  });

  // ---- 东南西北方位轴线 ----
  ctx.setLineDash([7,5]); ctx.lineWidth = 1.3;
  ctx.strokeStyle = 'rgba(90,130,165,.85)';
  let q1 = P([0,-RG,0]), q2 = P([0,RG,0]);
  ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y); ctx.stroke();
  q1 = P([-RG,0,0]); q2 = P([RG,0,0]);
  ctx.beginPath(); ctx.moveTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = 'bold 16px "Microsoft YaHei"';
  [['北',0,RG*0.985],['南',0,-RG*0.985],['东',RG*0.985,0],['西',-RG*0.985,0]].forEach(([t,x,y]) => {
    const q = P([x,y,0]);
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.strokeText(t, q.x-9, q.y+6);
    ctx.fillStyle = '#175a8e'; ctx.fillText(t, q.x-9, q.y+6);
  });

  // ---- 塔影 + 定日镜影子 ----
  if (ss.elv > 3) {
    const sa = ss.azi*D2R, sh = Math.min(80, TOWER_H*2.0/Math.tan(Math.max(ss.elv,8)*D2R));
    const e2 = P([-Math.sin(sa)*sh, -Math.cos(sa)*sh, 0]);
    const o = P([0,0,0]);
    ctx.strokeStyle = 'rgba(60,90,120,.18)'; ctx.lineWidth = 16; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(o.x,o.y); ctx.lineTo(e2.x,e2.y); ctx.stroke(); ctx.lineCap='butt';

    const sz = ss.s[2];
    ctx.fillStyle = 'rgba(55,85,115,.14)';
    mirrors.forEach((m) => {
      const pose = mirrorPose(m, ss);
      let a1, b1;
      if (pose) {
        a1 = norm(cross(pose.n, [0,0,1]));
        if (!isFinite(a1[0])) a1 = [1,0,0];
        b1 = norm(cross(pose.n, a1));
      } else { a1 = [1,0,0]; b1 = [0,1,0]; }
      const cs = [[+MW/2,+ML/2],[-MW/2,+ML/2],[-MW/2,-ML/2],[+MW/2,-ML/2]].map(([u, v]) => {
        const X = m.x + a1[0]*u + b1[0]*v;
        const Y = m.y + a1[1]*u + b1[1]*v;
        const Z = MIRROR_H + a1[2]*u + b1[2]*v;
        return P([X - ss.s[0]*Z/sz, Y - ss.s[1]*Z/sz, 0]);
      });
      ctx.beginPath();
      cs.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
      ctx.closePath(); ctx.fill();
    });
  }

  // ---- 绘制单面定日镜 / 单条光线（前后分层调用，保证塔不透明遮挡） ----
  const drawOneMirror = (m, i) => {
    const q = P([m.x, m.y, MIRROR_H]);
    const pose = mirrorPose(m, ss);

    if (pose) {
      let a1 = norm(cross(pose.n, [0,0,1]));
      if (!isFinite(a1[0])) a1 = [1,0,0];
      const b1 = norm(cross(pose.n, a1));
      const T = 0.4;   // 镜面厚度（向正下方拉伸，为原厚度 0.8 的一半）
      const csW = [
        [m.x+a1[0]*MW/2+b1[0]*ML/2, m.y+a1[1]*MW/2+b1[1]*ML/2, MIRROR_H+a1[2]*MW/2+b1[2]*ML/2],
        [m.x-a1[0]*MW/2+b1[0]*ML/2, m.y-a1[1]*MW/2+b1[1]*ML/2, MIRROR_H-a1[2]*MW/2+b1[2]*ML/2],
        [m.x-a1[0]*MW/2-b1[0]*ML/2, m.y-a1[1]*MW/2-b1[1]*ML/2, MIRROR_H-a1[2]*MW/2-b1[2]*ML/2],
        [m.x+a1[0]*MW/2-b1[0]*ML/2, m.y+a1[1]*MW/2-b1[1]*ML/2, MIRROR_H+a1[2]*MW/2-b1[2]*ML/2],
      ];
      const cs = csW.map(P);
      // 厚度向地面方向拉伸：背面 = 正面竖直向下偏移 T（正面朝向反射光一侧）
      const back = csW.map(c => P([c[0], c[1], c[2]-T]));
      const slot = state.sel.indexOf(i);
      // 相机在镜面正面一侧才画反光面，否则只看到灰黑色背面（体现真实朝向）
      const vx = camPos[0]-m.x, vy = camPos[1]-m.y, vz = camPos[2]-MIRROR_H;
      const seenFront = (vx*pose.n[0] + vy*pose.n[1] + vz*pose.n[2]) > 0;
      // 背面与四个侧面（银灰白框架质感），体现镜面厚度
      ctx.fillStyle = '#c2c8cf'; ctx.strokeStyle = '#7d858f'; ctx.lineWidth = 0.8;
      ctx.beginPath();
      back.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
      ctx.closePath(); ctx.fill(); ctx.stroke();
      drawMirrorGrid(ctx, P, csW, PED.cols, PED.rows, 'rgba(110,120,132,.6)', 0.7, T);
      for (let j = 0; j < 4; j++) {
        const k2 = (j+1)%4;
        ctx.beginPath();
        ctx.moveTo(cs[j].x, cs[j].y); ctx.lineTo(cs[k2].x, cs[k2].y);
        ctx.lineTo(back[k2].x, back[k2].y); ctx.lineTo(back[j].x, back[j].y);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      if (seenFront) {
        // 正面（镜面配色不变：蓝面）+ 选中时仅外围边框用槽位色
        ctx.beginPath();
        cs.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
        ctx.closePath();
        ctx.fillStyle = '#4353c5'; ctx.fill();
        ctx.strokeStyle = slot >= 0 ? SEL_COLORS[slot] : '#2a3670'; ctx.lineWidth = slot >= 0 ? 4 : 1.1; ctx.stroke();
        drawMirrorGrid(ctx, P, csW, PED.cols, PED.rows, 'rgba(255,255,255,.5)', 0.8, 0);
        ctx.beginPath();
        ctx.moveTo(cs[0].x, cs[0].y); ctx.lineTo(cs[1].x, cs[1].y); ctx.lineTo(cs[2].x, cs[2].y);
        ctx.closePath(); ctx.fillStyle = 'rgba(190,225,255,.5)'; ctx.fill();
      } else if (slot >= 0) {
        // 从背面看：保持灰黑背面质感，仅用槽位色描边标识选中
        ctx.strokeStyle = SEL_COLORS[slot]; ctx.lineWidth = 2.4;
        ctx.beginPath();
        back.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
        ctx.closePath(); ctx.stroke();
      }
    } else {
      // 停用：水平放置的镜面（平面四边形，同样向下拉伸厚度）
      const a1 = [1, 0, 0], b1 = [0, 1, 0];
      const T = 0.4;
      const csW = [
        [m.x+a1[0]*MW/2+b1[0]*ML/2, m.y+a1[1]*MW/2+b1[1]*ML/2, MIRROR_H+a1[2]*MW/2+b1[2]*ML/2],
        [m.x-a1[0]*MW/2+b1[0]*ML/2, m.y-a1[1]*MW/2+b1[1]*ML/2, MIRROR_H-a1[2]*MW/2+b1[2]*ML/2],
        [m.x-a1[0]*MW/2-b1[0]*ML/2, m.y-a1[1]*MW/2-b1[1]*ML/2, MIRROR_H-a1[2]*MW/2-b1[2]*ML/2],
        [m.x+a1[0]*MW/2-b1[0]*ML/2, m.y+a1[1]*MW/2-b1[1]*ML/2, MIRROR_H+a1[2]*MW/2-b1[2]*ML/2],
      ];
      const cs = csW.map(P);
      const back = csW.map(c => P([c[0], c[1], c[2]-T]));
      ctx.fillStyle = '#c2c8cf'; ctx.strokeStyle = '#7d858f'; ctx.lineWidth = 0.8;
      for (let j = 0; j < 4; j++) {
        const k2 = (j+1)%4;
        ctx.beginPath();
        ctx.moveTo(cs[j].x, cs[j].y); ctx.lineTo(cs[k2].x, cs[k2].y);
        ctx.lineTo(back[k2].x, back[k2].y); ctx.lineTo(back[j].x, back[j].y);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
      ctx.beginPath();
      cs.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
      ctx.closePath();
      ctx.fillStyle = '#9db1c2'; ctx.fill();
      ctx.strokeStyle = '#5a7186'; ctx.lineWidth = 1.1; ctx.stroke();
      drawMirrorGrid(ctx, P, csW, PED.cols, PED.rows, 'rgba(255,255,255,.4)', 0.7, 0);
    }
  };
  // 选中镜的地面转动方向箭头构造器：返回绘制闭包（null=当前无需绘制）
  const makeRotationArc = (mIdx, slot) => {
    const m = mirrors[mIdx];
    const cur = poseAt(mIdx, state.timeMin);
    if (isNaN(cur.face)) return null;
    // 中心差分 + 逐级扩大时间窗，避免转动极缓/接近极值时漏画
    const getFace = tm => { const p = poseAt(mIdx, tm); return isNaN(p.face) ? null : p.face; };
    let dA = null;
    for (const dt of [10, 20, 40, 80]) {
      const f1 = getFace(state.timeMin - dt), f2 = getFace(state.timeMin + dt);
      if (f1 === null || f2 === null) continue;
      const d = ((f2 - f1 + 540) % 360) - 180;
      if (Math.abs(d) >= 0.5) { dA = d; break; }
      if (dA === null) dA = d;
    }
    if (dA === null || Math.abs(dA) < 0.3) return null;
    const cw = dA > 0;
    const k = 0.7, R = 15*k, z = 0.4, SWEEP = 300, sgn = cw ? 1 : -1;
    const pt = a => { const r0 = a*D2R; return P([m.x + Math.sin(r0)*R, m.y + Math.cos(r0)*R, z]); };
    const a0 = cur.face - sgn * SWEEP;
    const q1 = pt(a0 + sgn * SWEEP * 0.97), q2 = pt(cur.face);
    let dx = q2.x - q1.x, dy = q2.y - q1.y;
    const L = Math.hypot(dx, dy) || 1; dx /= L; dy /= L;
    const base = P([m.x, m.y, 0]);
    const txt = cw ? '顺时针' : '逆时针';
    return () => {
      // 白色描边打底 + 彩色粗弧（约 300°，缺口处大箭头）
      const drawArc = (w, col) => {
        ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const q = pt(a0 + sgn * SWEEP * i / 40);
          i ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y);
        }
        ctx.stroke(); ctx.lineCap = 'butt';
      };
      drawArc(9*k, 'rgba(255,255,255,.85)');
      drawArc(4.5*k, SEL_COLORS[slot]);
      // 大箭头
      ctx.fillStyle = SEL_COLORS[slot];
      ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2*k;
      ctx.beginPath();
      ctx.moveTo(q2.x + dx*15*k, q2.y + dy*15*k);
      ctx.lineTo(q2.x - dx*4*k + dy*9*k, q2.y - dy*4*k - dx*9*k);
      ctx.lineTo(q2.x - dx*4*k - dy*9*k, q2.y - dy*4*k + dx*9*k);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      // 顺/逆时针文字
      ctx.font = `bold ${14*k}px "Microsoft YaHei"`;
      ctx.lineWidth = 4*k; ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineJoin = 'round';
      ctx.strokeText(txt, base.x - 25*k, base.y + 30*k);
      ctx.fillStyle = SEL_COLORS[slot];
      ctx.fillText(txt, base.x - 25*k, base.y + 30*k);
    };
  };
  // 中央吸热塔绘制器（真实透视：灰色收分圆塔身 + 圆柱吸热器，工作时吸热器呈黄色发光）
  const drawTower = () => {
    // 太阳水平方向（用于塔身明暗着色；夜间用默认漫射光）
    const sh = ss.elv > 3 ? norm([ss.s[0], ss.s[1], 0]) : null;
    // 塔身：收分圆台（底 r=5.0 → 顶 r=1.9），端面仅相机可见时绘制
    drawCyl3D(ctx, P, 0, 0, 5.0, 1.9, 0, TOWER_H, '#e3ebf2', '#8fa2b2', null, sh);
    // 塔顶灰色端盖环
    drawCyl3D(ctx, P, 0, 0, 4.0, 4.0, TOWER_H-0.6, TOWER_H, '#aeb9c4', null, '#c9d2da', sh);
    // 吸热器：圆柱体；工作时黄色，不工作时灰色、无发光
    drawCyl3D(ctx, P, 0, 0, 5.2, 5.2, TOWER_H, TOWER_H + REC_H,
      ss.working ? '#ffc23d' : '#a7b2bc',
      ss.working ? '#e0a52e' : '#8b98a3',
      ss.working ? '#ffe28a' : '#c2ccd4', sh);
  };

  // ---- 全场景统一深度排序绘制（近大远小真实遮挡：镜面体、光线段、塔、地面转动箭头） ----
  hitList = [];
  const towerDep = P([0, 0, TOWER_H*0.5]).dep;
  const rec2 = P([0,0,REC_CENTER]);            // 吸热器中心 = 所有反射光线的汇聚点
  const sun = sunScreen(ss, W, H);
  const items = [];
  // 每面定日镜：下部支架 / 镜面体 / 关节 三个独立深度项（真实遮挡关系）
  mirrors.forEach((m, i) => {
    const q = P([m.x, m.y, MIRROR_H]);
    const pose = mirrorPose(m, ss);
    const sH = [ss.s[0], ss.s[1]];
    // 支架按细切片判定与镜板的遮挡关系，再按连续同状态合并成组绘制：
    // 视线穿过板体(含厚度)的切片 → 画在镜面后；其余切片必在镜板前方（凸板体保证）→ 画在镜面前。
    // 合并后每面镜支架最多 2 个绘制项，既避免逐切片描边形成条纹，又保证像素级正确的遮挡
    let cur = null;
    for (let zs = 0; zs < PED.ballZ; zs += PED.sliceH) {
      const z1s = Math.min(zs + PED.sliceH, PED.ballZ);
      const hidden = segHitsMirrorQuad(m, pose, camPos, [m.x, m.y, (zs + z1s) / 2]);
      if (cur && cur.hidden === hidden) { cur.z1 = z1s; }
      else { const r = { hidden, z0: zs, z1: z1s }; cur = r; items.push({ dep: hidden ? q.dep + 1 : q.dep - 1, draw: () => drawPedestalSpan(ctx, P, m, sH, 10, r.z0, r.z1) }); }
    }
    // 圆球嵌在镜背中心（背面视角可见）：相机在镜背侧时画在镜面前，正面时被镜面遮挡
    const frontCamM = pose ? ((camPos[0]-m.x)*pose.n[0] + (camPos[1]-m.y)*pose.n[1] + (camPos[2]-MIRROR_H)*pose.n[2]) > 0 : true;
    items.push({ dep: frontCamM ? q.dep + 1 : q.dep - 1, draw: () => drawBall(ctx, P, m) });
    items.push({ dep: q.dep, draw: () => { drawOneMirror(m, i); hitList.push({ x: q.x, y: q.y, i }); } });
  });
  // 每面工作镜的两段光线（太阳→镜、镜→吸热器）作为独立深度项参与排序
  if (ss.working) {
    mirrors.forEach((m, i) => {
      const pose = mirrorPose(m, ss);
      if (!pose) return;
      const q = P([m.x, m.y, MIRROR_H]);
      const slot = state.sel.indexOf(i);
      const seg = (a, b, dep) => items.push({ dep, draw: () => {
        ctx.strokeStyle = slot >= 0 ? 'rgba(255,205,40,.95)' : 'rgba(255,215,80,.55)';
        ctx.lineWidth = slot >= 0 ? 4 : 2; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.lineCap = 'butt';
      }});
      // 入射段：平行光线——太阳位于无穷远，每条入射线均沿同一太阳方向向量（近段指向太阳）
      const LEN = 64;
      const up = P([m.x + ss.s[0]*LEN, m.y + ss.s[1]*LEN, MIRROR_H + ss.s[2]*LEN]);
      seg(up, q, (up.dep + q.dep)/2);
      // 反射段：由反射定律 R = I - 2(I·n)n 求真实反射方向（I = -s 为入射传播方向）
      // 因 n 取 (s+t) 角平分线，R 与 t 同向，光线正好落到吸热器中心
      const R = reflectDir([-ss.s[0], -ss.s[1], -ss.s[2]], pose.n);
      const distT = Math.hypot(m.x, m.y, REC_CENTER - MIRROR_H);
      const hit = P([m.x + R[0]*distT, m.y + R[1]*distT, MIRROR_H + R[2]*distT]);
      seg(q, hit, (q.dep + rec2.dep) / 2);
    });
  }
  // 选中镜的地面转动方向箭头：地面标记，深度比所在镜基座略远，不遮挡上方镜面与塔
  state.sel.forEach((mIdx, slot) => {
    if (mIdx == null) return;
    const fn = makeRotationArc(mIdx, slot);
    if (fn) items.push({ dep: P([mirrors[mIdx].x, mirrors[mIdx].y, 0]).dep + 0.5, draw: fn });
  });
  items.push({ dep: towerDep, draw: drawTower });
  items.sort((a, b) => b.dep - a.dep);
  items.forEach(o => o.draw());

  // ---- 吸热器光晕（仅工作时发光；不工作时吸热器为灰色圆柱、无光晕） ----
  if (ss.working) {
    const rec = P([0,0,REC_CENTER]);
    const glowR = 34*rec.k + 16;
    const rg = ctx.createRadialGradient(rec.x, rec.y, 2, rec.x, rec.y, glowR);
    rg.addColorStop(0,'rgba(255,235,140,.95)'); rg.addColorStop(0.4,'rgba(255,220,90,.45)'); rg.addColorStop(1,'rgba(255,220,90,0)');
    ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(rec.x, rec.y, glowR, 0, 2*Math.PI); ctx.fill();
  }

  // ---- 太阳（地平线以上即显示） ----
  if (ss.elv > 0 && sun.y > -60 && sun.y < H + 60) {
    ctx.save();
    const R0 = 26;
    const sg = ctx.createRadialGradient(sun.x, sun.y, 4, sun.x, sun.y, R0*2.1);
    sg.addColorStop(0,'#fff3b0'); sg.addColorStop(0.5,'#ffd94a'); sg.addColorStop(1,'rgba(255,217,74,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(sun.x, sun.y, R0*2.1, 0, 2*Math.PI); ctx.fill();
    ctx.strokeStyle = '#ffcf3d'; ctx.lineWidth = 2.4;
    for (let k = 0; k < 12; k++) {
      const a = k/12*2*Math.PI + (Date.now()%3000)/3000*2*Math.PI/12;
      ctx.beginPath();
      ctx.moveTo(sun.x+Math.cos(a)*R0*1.15, sun.y+Math.sin(a)*R0*1.15);
      ctx.lineTo(sun.x+Math.cos(a)*R0*1.55, sun.y+Math.sin(a)*R0*1.55);
      ctx.stroke();
    }
    ctx.fillStyle = '#ffdf55'; ctx.beginPath(); ctx.arc(sun.x, sun.y, R0, 0, 2*Math.PI); ctx.fill();
    ctx.restore();
  }

  // ---- 标注（仅吸热器） ----
  const recL = P([0,0,TOWER_H + REC_H]);
  label(ctx, '吸热器', recL.x + 46, recL.y - 26, recL.x + 8, recL.y - 4);
}

/* ============ 俯视平面图（浮动窗口内，可点击选镜） ============ */
let planHitList = [];   // 平面图上可点击镜面 {x,y,idx}
function drawPlan() {
  const cv = document.getElementById('plan');
  const W = cv.clientWidth, H = cv.clientHeight;
  if (W < 10 || H < 10) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const ss = sunState();
  planHitList = [];

  const pcx = W*0.5, pcy = H*0.54, pr = Math.min(W,H)/2 - 26;
  const toPx = (mx, my) => [pcx + mx/118*pr, pcy + my/118*pr];
  ctx.strokeStyle = '#b8d2e4';
  [55, 85, 115].forEach(r => { ctx.beginPath(); ctx.arc(pcx, pcy, r/118*pr, 0, 2*Math.PI); ctx.stroke(); });
  // 指北针 + 方位
  ctx.fillStyle = '#1a5b96'; ctx.font = 'bold 12px "Microsoft YaHei"';
  ctx.fillText('北 N', pcx - 12, pcy - pr - 6);
  ctx.beginPath(); ctx.moveTo(pcx, pcy-pr+2); ctx.lineTo(pcx-4, pcy-pr+12); ctx.lineTo(pcx+4, pcy-pr+12); ctx.closePath(); ctx.fill();
  ctx.font = '12px "Microsoft YaHei"'; ctx.fillStyle = '#476a86';
  ctx.fillText('南', pcx - 6, pcy + pr + 14);
  ctx.fillText('东', pcx + pr + 6, pcy + 4);
  ctx.fillText('西', pcx - pr - 16, pcy + 4);
  // 方位轴
  ctx.strokeStyle = 'rgba(90,130,165,.6)'; ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(pcx, pcy-pr); ctx.lineTo(pcx, pcy+pr); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pcx-pr, pcy); ctx.lineTo(pcx+pr, pcy); ctx.stroke();
  ctx.setLineDash([]);
  // 镜子点
  mirrors.forEach((m, i) => {
    const [x, y] = toPx(m.x, m.y);
    planHitList.push({ x, y, i });
    const slot = state.sel.indexOf(i);
    if (slot >= 0) {
      ctx.fillStyle = SEL_COLORS[slot];
      ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 2*Math.PI); ctx.fill();
      ctx.strokeStyle = '#ffd400'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 8, 0, 2*Math.PI); ctx.stroke();
    } else {
      ctx.fillStyle = '#2f66b0';
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, 2*Math.PI); ctx.fill();
    }
  });
  // 塔
  ctx.fillStyle = '#37628c'; ctx.beginPath(); ctx.arc(pcx, pcy, 5, 0, 2*Math.PI); ctx.fill();
  ctx.fillStyle = '#557'; ctx.font = '11px sans-serif'; ctx.fillText('塔', pcx + 7, pcy + 4);
  // 太阳方位箭头
  if (ss.elv > 0) {
    const a = ss.azi*D2R, L = pr*0.94;
    const x2 = pcx + Math.sin(a)*L, y2 = pcy - Math.cos(a)*L;
    ctx.strokeStyle = '#f5a623'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(pcx, pcy); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.save(); ctx.translate(x2, y2); ctx.rotate(Math.atan2(y2-pcy, x2-pcx));
    ctx.fillStyle = '#f5a623'; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-9,-4.5); ctx.lineTo(-9,4.5); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#c07b00'; ctx.font = '11px "Microsoft YaHei"'; ctx.fillText('太阳方位', x2 + 6, y2 + 4);
  }
}

/* ============ 4 个定日镜的仰角 / 方位角日变化曲线（可复用渲染到任意画布） ============ */
function drawSunIcon(ctx, x, y, r) {   // 曲线图当前时刻的小太阳标记
  const g = ctx.createRadialGradient(x, y, r*0.3, x, y, r*1.9);
  g.addColorStop(0,'#fff3b0'); g.addColorStop(0.5,'#ffd94a'); g.addColorStop(1,'rgba(255,217,74,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r*1.9, 0, 2*Math.PI); ctx.fill();
  ctx.strokeStyle = '#f5a623'; ctx.lineWidth = Math.max(1, r*0.16); ctx.lineCap = 'round';
  for (let k = 0; k < 8; k++) {
    const a = k/8*2*Math.PI;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a)*r*1.15, y+Math.sin(a)*r*1.15);
    ctx.lineTo(x+Math.cos(a)*r*1.5, y+Math.sin(a)*r*1.5);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
  ctx.fillStyle = '#ffdf55'; ctx.beginPath(); ctx.arc(x, y, r, 0, 2*Math.PI); ctx.fill();
  ctx.strokeStyle = '#e6a800'; ctx.lineWidth = Math.max(1, r*0.14); ctx.stroke();
}
function renderChart(cv) {
  const W = cv.clientWidth, H = cv.clientHeight;
  if (W < 10 || H < 10) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const s = Math.max(1, Math.min(2, W/440));   // 缩放系数：放大窗口中字号/线宽随之增大

  const gx = 40*s, gx2 = W - 34*s, gy = 16, gh = H - gy - 14*s;   // 底部仅预留横轴刻度（图例已移至 HTML）
  const X = t => gx + t/24*(gx2 - gx);
  const YE = v => gy + gh - v/90*gh;      // 仰角 0~90（左轴）
  const YA = v => gy + gh - v/360*gh;     // 方位角 0~360（右轴）
  // 工作时段底色
  const wr = findWorkingRange();
  if (wr) { ctx.fillStyle = 'rgba(255,214,90,.14)'; ctx.fillRect(X(wr.a), gy, X(wr.b)-X(wr.a), gh); }
  // 网格
  ctx.strokeStyle = '#e4eef6'; ctx.lineWidth = 1; ctx.font = `${10*s}px sans-serif`;
  for (let t = 0; t <= 24; t += 3) {
    ctx.fillStyle = '#689';
    ctx.beginPath(); ctx.moveTo(X(t), gy); ctx.lineTo(X(t), gy+gh); ctx.stroke();
    ctx.fillText(t + '时', X(t)-9*s, gy+gh+11*s);
  }
  [0,30,60,90].forEach(v => { ctx.fillStyle = '#1565c0'; ctx.fillText(v, gx-16*s, YE(v)+3*s);
    ctx.strokeStyle = '#e4eef6'; ctx.beginPath(); ctx.moveTo(gx, YE(v)); ctx.lineTo(gx2, YE(v)); ctx.stroke(); });
  [0,90,180,270,360].forEach(v => { ctx.fillStyle = '#c07b00'; ctx.fillText(v, gx2+3*s, YA(v)+3*s); });
  ctx.strokeStyle = '#9db8cc'; ctx.strokeRect(gx, gy, gx2-gx, gh);

  // 每镜两条曲线：仰角=实线（停用段浅虚线），方位角=虚线（线宽2、线段30/间隔15），颜色区分镜
  // 连续路径绘制：虚线相位跨采样点连续，才会呈现真正的 30/15 虚线段
  const step = 4;
  state.sel.forEach((mIdx, slot) => {
    if (mIdx == null) return;   // 未选择槽位不绘制曲线
    const color = SEL_COLORS[slot];
    const drawRun = (pts, on, kind) => {
      if (pts.length < 2) return;
      ctx.strokeStyle = color;
      ctx.lineWidth = 2*s;
      if (kind === 'elv') {
        ctx.setLineDash(on ? [] : [4*s, 3*s]);
        ctx.globalAlpha = on ? 1 : 0.55;
      } else {
        ctx.setLineDash([3*s, 3*s]);          // 方位角：线段 3、间隔 3（细密虚线）
        ctx.globalAlpha = on ? 1 : 0.45;
      }
      ctx.beginPath();
      pts.forEach((pt, k) => k ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y));
      ctx.stroke();
      ctx.globalAlpha = 1;
    };
    let eRun = null, eOn = null, aRun = null, aOn = null, lastFace = null;
    for (let tm = 0; tm <= 1440; tm += step) {
      const p = poseAt(mIdx, tm);
      const x = X(tm/60);
      if (isNaN(p.tilt)) {
        if (eRun) { drawRun(eRun, eOn, 'elv'); eRun = null; }
        if (aRun) { drawRun(aRun, aOn, 'azi'); aRun = null; }
        lastFace = null; continue;
      }
      const on = p.elv >= WORK_MIN;
      // 仰角曲线
      if (state.showElv[slot]) {
        if (!eRun || on !== eOn) { if (eRun) drawRun(eRun, eOn, 'elv'); eRun = []; eOn = on; }
        eRun.push({ x, y: YE(p.tilt) });
      }
      // 方位角曲线（跨越 0°/360° 跳变处断开，避免连出竖直假线）
      if (state.showAzi[slot]) {
        const jump = lastFace === null || Math.abs(p.face - lastFace) >= 180;
        if (jump) {
          if (aRun) drawRun(aRun, aOn, 'azi');
          aRun = []; aOn = on;
        } else if (!aRun || on !== aOn) {
          const prevPt = aRun ? aRun[aRun.length-1] : null;
          if (aRun) drawRun(aRun, aOn, 'azi');
          aRun = prevPt ? [prevPt] : [];
          aOn = on;
        }
        aRun.push({ x, y: YA(p.face) });
      }
      lastFace = p.face;
    }
    if (eRun) drawRun(eRun, eOn, 'elv');
    if (aRun) drawRun(aRun, aOn, 'azi');
  });
  ctx.setLineDash([]);
  // 当前时刻红点：每条可见曲线在当前时间位置画一个小红点，随时间推移沿曲线运动
  const ssNow0 = sunState();
  const dotDim = ssNow0.elv > 0 && ssNow0.elv < WORK_MIN;   // 日出后未达工作高度角时红点变淡
  state.sel.forEach((mIdx, slot) => {
    if (mIdx == null) return;
    const p = poseAt(mIdx, state.timeMin);
    if (isNaN(p.tilt)) return;
    const dx = X(state.timeMin/60);
    const drawDot = (y) => {
      ctx.save();
      if (dotDim) ctx.globalAlpha = 0.45;
      ctx.beginPath(); ctx.arc(dx, y, 3.2*s, 0, Math.PI*2);
      ctx.fillStyle = '#e53935'; ctx.fill();
      ctx.lineWidth = 1.2*s; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.restore();
    };
    if (state.showElv[slot]) drawDot(YE(p.tilt));
    if (state.showAzi[slot]) drawDot(YA(p.face));
  });
  // 当前时刻：小太阳标记（不画红色竖线；日出后显示，未达工作高度角时亮度降 50%，日出前不显示）
  const ssNow = sunState();
  if (ssNow.elv > 0) {
    const cx0 = X(state.timeMin/60);
    ctx.save();
    if (ssNow.elv < WORK_MIN) ctx.globalAlpha = 0.5;
    drawSunIcon(ctx, cx0, gy, 6.5*s);   // 太阳缩小，中心放在顶部框线上
    ctx.restore();
  }
}
function drawChart() {
  renderChart(document.getElementById('chart'));
  renderChart(document.getElementById('chartBig'));   // 放大窗口打开时同步重绘
}
function findWorkingRange() {
  let a = null, b = null;
  for (let tm = 0; tm <= 1440; tm += 5) {
    if (poseAt(0, tm).elv >= WORK_MIN) { if (a === null) a = tm/60; b = tm/60; }
  }
  return a === null ? null : { a, b };
}

/* ============ 信息刷新 ============ */
function fmtClock(min) {   // 时:分:秒 整数显示
  const t = Math.max(0, Math.floor(min));
  const h = Math.floor(t/60), m = t%60, s = Math.floor((min - Math.floor(min)) * 60);
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function update() {
  const ss = sunState();
  if (typeof setElvUI === 'function') setElvUI();   // 垂直视角滑杆与状态双向同步
  document.getElementById('timeVal').textContent = fmtClock(state.timeMin);
  document.getElementById('decVal').textContent = (ss.decl >= 0 ? '+' : '') + ss.decl.toFixed(2) + '°';
  document.getElementById('rElv').textContent = ss.elv > 0 ? ss.elv.toFixed(2) + '°' : '地平线下';
  document.getElementById('rAzi').textContent = ss.elv > 0 ? ss.azi.toFixed(2) + '°' : '--';
  const sh = Math.floor(ss.solarT), sm = Math.round((ss.solarT - sh)*60);
  document.getElementById('rSolar').textContent = `${(sh + Math.floor(sm/60) + 24)%24}:${String(sm%60).padStart(2,'0')}`;
  document.getElementById('rState').textContent = ss.working ? '聚光中' : (ss.elv > 0 ? '低于阈值停用' : '夜间');
  // 4 个选中镜当前值（未选择的槽位显示"未选择"）
  document.getElementById('selInfo').innerHTML = state.sel.map((mIdx, slot) => {
    if (mIdx == null) return `<span style="color:#9aa7b2;font-weight:bold">镜${slot+1}</span>：未选择`;
    const p = poseAt(mIdx, state.timeMin);
    const tv = isNaN(p.tilt) ? '停用' : `仰角 ${p.tilt.toFixed(1)}°　方位角 ${p.face.toFixed(1)}°`;
    return `<span style="color:${SEL_COLORS[slot]};font-weight:bold">镜${slot+1} ${mirrors[mIdx].id}</span>：${tv}`;
  }).join('<br>');
  drawScene(); drawPlan(); drawChart(); drawZoom();
}

/* ============ 交互 ============ */
document.getElementById('city').addEventListener('change', e => {
  if (e.target.value === 'custom') return;
  const [lo, la] = e.target.value.split(',').map(Number);
  state.lon = lo; state.lat = la;
  document.getElementById('lon').value = lo; document.getElementById('lat').value = la;
  update();
});
document.getElementById('lon').addEventListener('input', e => { state.lon = parseFloat(e.target.value)||0; update(); });
document.getElementById('lat').addEventListener('input', e => { state.lat = parseFloat(e.target.value)||0; update(); });
document.getElementById('date').addEventListener('input', e => { if (e.target.value) { state.date = e.target.value; update(); } });
document.getElementById('time').addEventListener('input', e => { state.timeMin = +e.target.value; state.playing = false; update(); });

// 4 个定日镜选择下拉框（支持"未选择"空槽位）
const selSels = [0,1,2,3].map(k => document.getElementById('sel'+k));
selSels.forEach(s => {
  const o = document.createElement('option');
  o.value = ''; o.textContent = '未选择';
  s.appendChild(o);
});
mirrors.forEach((m, i) => {
  selSels.forEach(s => { const o = document.createElement('option'); o.value = i; o.textContent = m.id; s.appendChild(o); });
});
function syncSelSels() {
  state.sel.forEach((v, k) => selSels[k].value = v == null ? '' : String(v));
  buildLegend();
  if (typeof buildZoomTabs === 'function') buildZoomTabs();
}
// HTML 图例：每镜后带仰角/方位角显示复选框（原窗口与放大窗口共用）
function buildLegend() {
  ['legend', 'legendBig'].forEach(id => {
    const lg = document.getElementById(id);
    if (!lg) return;
    lg.innerHTML = '';
    state.sel.forEach((mIdx, slot) => {
      if (mIdx == null) return;   // 未选择槽位不出现在图例中
      const d = document.createElement('div');
      d.className = 'lgitem';
      d.innerHTML =
        `<span class="lgline" style="border-color:${SEL_COLORS[slot]}"></span>` +
        `<span class="lgname" style="color:${SEL_COLORS[slot]}">镜${slot+1} ${mirrors[mIdx].id}</span>` +
        `<label><input type="checkbox" data-slot="${slot}" data-k="e" ${state.showElv[slot]?'checked':''}>仰角</label>` +
        `<label><input type="checkbox" data-slot="${slot}" data-k="a" ${state.showAzi[slot]?'checked':''}>方位角</label>`;
      lg.appendChild(d);
    });
  });
}
document.getElementById('legend').addEventListener('change', e => {
  const slot = +e.target.dataset.slot;
  if (isNaN(slot)) return;
  if (e.target.dataset.k === 'e') state.showElv[slot] = e.target.checked;
  else state.showAzi[slot] = e.target.checked;
  buildLegend(); drawChart();
});
document.getElementById('legendBig').addEventListener('change', e => {
  const slot = +e.target.dataset.slot;
  if (isNaN(slot)) return;
  if (e.target.dataset.k === 'e') state.showElv[slot] = e.target.checked;
  else state.showAzi[slot] = e.target.checked;
  buildLegend(); drawChart();
});
syncSelSels();
selSels.forEach((s, k) => s.addEventListener('change', e => { state.sel[k] = e.target.value === '' ? null : +e.target.value; syncSelSels(); update(); }));

// 选镜：优先填入第一个"未选择"槽位，已选满则轮换写入（场景与平面图共用）
function assignSlot(idx) {
  const exist = state.sel.indexOf(idx);
  if (exist >= 0) { state.selSlot = exist; }        // 已选中则下次覆盖该槽
  else {
    const nul = state.sel.indexOf(null);
    state.selSlot = nul >= 0 ? nul : (state.selSlot + 1) % 4;
  }
  state.sel[state.selSlot] = idx;
  syncSelSels(); update();
}

// 场景点击选镜
document.getElementById('scene').addEventListener('click', e => {
  const rect = e.target.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  let best = -1, bd = 22;
  for (const h of hitList) {
    const d = Math.hypot(h.x - px, h.y - py);
    if (d < bd) { bd = d; best = h.i; }
  }
  if (best >= 0) assignSlot(best);
});

// 平面图点击选镜（最多 4 面，与场景一致）
document.getElementById('plan').addEventListener('click', e => {
  const rect = e.target.getBoundingClientRect();
  const px = (e.clientX - rect.left), py = (e.clientY - rect.top);
  let best = -1, bd = 11;
  for (const h of planHitList) {
    const d = Math.hypot(h.x - px, h.y - py);
    if (d < bd) { bd = d; best = h.i; }
  }
  if (best >= 0) assignSlot(best);
});

// 俯视平面图折叠/展开（展开为浮动窗口，不增加右侧面板高度）
const planFloat = document.getElementById('planFloat');
function togglePlan(show) {
  planFloat.style.display = show ? 'block' : 'none';
  document.getElementById('planFold').innerHTML = show ? '收起 &#9650;' : '展开 &#9660;';
  if (show) requestAnimationFrame(drawPlan);
}
document.getElementById('planFold').addEventListener('click', () => togglePlan(planFloat.style.display === 'none'));
document.getElementById('planClose').addEventListener('click', () => togglePlan(false));

// 浮动平面图窗口：按住标题栏可拖动到页面任意位置（默认位置保持不变）
(function () {
  const bar = planFloat.querySelector('h2');
  let pd = null;
  bar.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    const r = planFloat.getBoundingClientRect();
    pd = { ox: e.clientX - r.left, oy: e.clientY - r.top };
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!pd) return;
    const w = planFloat.offsetWidth, h = planFloat.offsetHeight;
    planFloat.style.left = Math.min(window.innerWidth - 40, Math.max(-w + 60, e.clientX - pd.ox)) + 'px';
    planFloat.style.top  = Math.min(window.innerHeight - 20, Math.max(0, e.clientY - pd.oy)) + 'px';
    planFloat.style.right = 'auto';
  });
  window.addEventListener('mouseup', () => pd = null);
})();

/* ============ 镜面特写 3D 窗口（默认收起，可切换显示镜1~镜4 任一选中镜的运动） ============ */
const zoomFloat = document.getElementById('zoomFloat');
state.zoomSlot = 0;
state.zoomCam = [null, null, null, null];   // 各槽位手动观察视角 {azi,elv,dist}，null = 默认沿镜面法线
function initZoomCam(slot) {   // 首次拖动时以当前默认视角为起点
  if (slot == null || slot < 0) return null;
  if (!state.zoomCam[slot]) {
    const m = mirrors[state.sel[slot]];
    const pose = mirrorPose(m, sunState());
    const n0 = pose ? pose.n : [0, 0.3, 0.9];
    state.zoomCam[slot] = {
      azi: Math.atan2(n0[0], n0[1]) * 180/Math.PI,
      elv: Math.min(80, Math.max(12, Math.asin(Math.max(-1, Math.min(1, n0[2])))*180/Math.PI + 8)),
      dist: 42,
    };
  }
  return state.zoomCam[slot];
}
function zoomActiveSlot() {   // 当前特写槽位（若为未选择则回退到第一个已选槽位）
  if (state.sel[state.zoomSlot] != null) return state.zoomSlot;
  const i = state.sel.findIndex(v => v != null);
  return i >= 0 ? i : -1;
}
function buildZoomTabs() {
  const tabs = document.getElementById('zoomTabs');
  if (!tabs) return;
  tabs.innerHTML = '';
  state.sel.forEach((mIdx, slot) => {
    const b = document.createElement('button');
    const dis = mIdx == null;
    b.textContent = `镜${slot+1}` + (dis ? '（未选择）' : ' ' + mirrors[mIdx].id);
    b.disabled = dis;
    b.style.borderColor = SEL_COLORS[slot];
    b.style.color = dis ? '#aabbcc' : SEL_COLORS[slot];
    if (slot === state.zoomSlot && !dis) { b.style.background = SEL_COLORS[slot]; b.style.color = '#fff'; }
    b.onclick = () => { state.zoomSlot = slot; buildZoomTabs(); drawZoom(); };
    tabs.appendChild(b);
  });
}
function toggleZoom(show) {
  zoomFloat.style.display = show ? 'block' : 'none';
  document.getElementById('zoomFold').innerHTML = show ? '镜面特写 &#9650;' : '镜面特写 &#9654;';
  if (show) requestAnimationFrame(drawZoom);
}
document.getElementById('zoomFold').addEventListener('click', () => toggleZoom(zoomFloat.style.display === 'none'));
document.getElementById('zoomClose').addEventListener('click', () => toggleZoom(false));

// 特写画布：拖动旋转观察视角、滚轮缩放、双击复位到默认（正对反光面）
(function () {
  const cv = document.getElementById('zoomCanvas');
  let zd = null;
  cv.addEventListener('mousedown', e => {
    const slot = zoomActiveSlot();
    const cam = initZoomCam(slot);
    if (!cam) return;
    zd = { x: e.clientX, y: e.clientY, cam };
    cv.style.cursor = 'grabbing';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!zd) return;
    zd.cam.azi -= (e.clientX - zd.x) * 0.55;                                       // 水平环绕
    zd.cam.elv = Math.min(88, Math.max(-8, zd.cam.elv + (e.clientY - zd.y) * 0.45)); // 垂直俯仰
    zd.x = e.clientX; zd.y = e.clientY;
    drawZoom();
  });
  window.addEventListener('mouseup', () => { if (zd) { zd = null; cv.style.cursor = 'grab'; } });
  cv.addEventListener('wheel', e => {
    const slot = zoomActiveSlot();
    const cam = initZoomCam(slot);
    if (!cam) return;
    cam.dist = Math.min(130, Math.max(16, cam.dist * (1 + Math.sign(e.deltaY) * 0.14)));
    e.preventDefault();
    drawZoom();
  }, { passive: false });
  cv.addEventListener('dblclick', () => {                 // 双击复位为默认视角
    const slot = zoomActiveSlot();
    if (slot >= 0) { state.zoomCam[slot] = null; drawZoom(); }
  });
})();
// 特写窗口拖动（限定在 3D 区范围内）
(function () {
  const bar = zoomFloat.querySelector('h2');
  const wrap = document.getElementById('sceneWrap');
  let zd = null;
  bar.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    const r = zoomFloat.getBoundingClientRect();
    zd = { ox: e.clientX - r.left, oy: e.clientY - r.top };
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!zd) return;
    const wr = wrap.getBoundingClientRect();
    zoomFloat.style.left = Math.min(wr.width - 60, Math.max(0, e.clientX - wr.left - zd.ox)) + 'px';
    zoomFloat.style.top  = Math.min(wr.height - 20, Math.max(0, e.clientY - wr.top - zd.oy)) + 'px';
    zoomFloat.style.right = 'auto';
  });
  window.addEventListener('mouseup', () => zd = null);
})();

function drawZoom() {
  if (zoomFloat.style.display === 'none') return;
  const cv = document.getElementById('zoomCanvas');
  const W = cv.clientWidth, H = cv.clientHeight;
  if (W < 10 || H < 10) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = W*dpr; cv.height = H*dpr;
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#a8d8ef'); g.addColorStop(1,'#e3f4fb');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  const slot = zoomActiveSlot();
  if (slot < 0) {
    ctx.fillStyle = '#5a7ea6'; ctx.font = '13px "Microsoft YaHei"';
    ctx.fillText('尚未选择定日镜：请在右侧下拉框、场景或平面图中点选镜面', 14, H/2 - 6);
    return;
  }
  const m = mirrors[state.sel[slot]];
  const ss = sunState();
  const pose = mirrorPose(m, ss);

  // 特写相机：默认沿镜面法线正对反光面；用户拖动后改为手动环绕视角（state.zoomCam[slot]）
  const n0 = pose ? pose.n : [0, 0.3, 0.9];          // 镜面法线（停用时取默认朝上）
  let camAzi, camElv, camDist;
  const zc = state.zoomCam[slot];
  if (zc) {
    camAzi = zc.azi; camElv = zc.elv; camDist = zc.dist;
  } else {
    camAzi = Math.atan2(n0[0], n0[1]) * 180/Math.PI;                        // 沿法线水平方向
    camElv = Math.min(80, Math.max(12, Math.asin(Math.max(-1, Math.min(1, n0[2])))*180/Math.PI + 8));
    camDist = 42;
  }
  const ca = camAzi*Math.PI/180, ce = camElv*Math.PI/180;
  const C = [m.x + Math.sin(ca)*Math.cos(ce)*camDist,
             m.y + Math.cos(ca)*Math.cos(ce)*camDist,
             MIRROR_H + Math.sin(ce)*camDist];
  const target = [m.x, m.y, MIRROR_H];
  const d = norm([target[0]-C[0], target[1]-C[1], target[2]-C[2]]);
  // 屏幕右向量与上向量：与主场景同一约定（u 的 z 分量恒为正，保证画面不上下颠倒）
  const r = Math.hypot(d[0], d[1]) < 1e-6 ? [1,0,0] : norm([-d[1], d[0], 0]);
  const u = cross(d, r);
  const F = 200, K = Math.min(W,H)/11, cx = W*0.5, cy = H*0.52;
  const P = p => {
    const px = p[0]-C[0], py = p[1]-C[1], pz = p[2]-C[2];
    const dep = Math.max(px*d[0]+py*d[1]+pz*d[2], 1);
    const k = K*F/(F+dep);
    return { x: cx + (px*r[0]+py*r[1]+pz*r[2])*k, y: cy - (px*u[0]+py*u[1]+pz*u[2])*k, dep, k };
  };
  camPos = C;   // 供 drawCyl3D 判断端面可见性
  // 真实深度（不钳制）：用于近平面裁剪与"是否在相机前方"判断
  const depOf = p => (p[0]-C[0])*d[0] + (p[1]-C[1])*d[1] + (p[2]-C[2])*d[2];

  // 地面圆盘 + 镜场圈线（特写区域）
  const RG = 55;
  ctx.beginPath();
  for (let i=0;i<=72;i++){ const a=i/72*2*Math.PI; const q=P([m.x+RG*Math.sin(a), m.y+RG*Math.cos(a), 0]); i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y); }
  ctx.closePath();
  ctx.fillStyle = '#c8e6f4'; ctx.fill();
  ctx.strokeStyle = '#a6cbe0'; ctx.lineWidth = 1.5; ctx.stroke();
  // 地面方位线（过镜面的南北/东西虚线）
  ctx.setLineDash([6,5]); ctx.strokeStyle = 'rgba(90,130,165,.6)'; ctx.lineWidth = 1;
  let qa = P([m.x-RG, m.y, 0]), qb = P([m.x+RG, m.y, 0]);
  ctx.beginPath(); ctx.moveTo(qa.x,qa.y); ctx.lineTo(qb.x,qb.y); ctx.stroke();
  qa = P([m.x, m.y-RG, 0]); qb = P([m.x, m.y+RG, 0]);
  ctx.beginPath(); ctx.moveTo(qa.x,qa.y); ctx.lineTo(qb.x,qb.y); ctx.stroke();
  ctx.setLineDash([]);
  // 虚线尽头标注东南西北方位名称：端点在画布外时钳制到虚线与画布边缘的交点处
  ctx.font = 'bold 13px "Microsoft YaHei"';
  const qg = P([m.x, m.y, 0]);
  [[m.x-RG, m.y, '西'], [m.x+RG, m.y, '东'], [m.x, m.y-RG, '南'], [m.x, m.y+RG, '北']].forEach(([wx, wy, t]) => {
    const p3 = [wx, wy, 0];
    if (depOf(p3) < 2 || depOf([m.x, m.y, 0]) < 2) return;
    const q = P(p3);
    let dx = q.x - qg.x, dy = q.y - qg.y;
    const L = Math.hypot(dx, dy);
    if (L < 20) return;
    dx /= L; dy /= L;
    // 沿方向求画布边界内最大可见距离（留边距）
    let tMax = Infinity;
    if (dx > 1e-6) tMax = Math.min(tMax, (W - 20 - qg.x)/dx);
    if (dx < -1e-6) tMax = Math.min(tMax, (20 - qg.x)/dx);
    if (dy > 1e-6) tMax = Math.min(tMax, (H - 26 - qg.y)/dy);
    if (dy < -1e-6) tMax = Math.min(tMax, (18 - qg.y)/dy);
    if (tMax < 24) return;
    const lx = qg.x + dx*tMax, ly = qg.y + dy*tMax;
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.strokeText(t, lx-6, ly+5);
    ctx.fillStyle = '#175a8e'; ctx.fillText(t, lx-6, ly+5);
  });

  // 镜面影子
  if (ss.elv > 3) {
    const sz = ss.s[2];
    let a1, b1;
    if (pose) {
      a1 = norm(cross(pose.n, [0,0,1]));
      if (!isFinite(a1[0])) a1 = [1,0,0];
      b1 = norm(cross(pose.n, a1));
    } else { a1 = [1,0,0]; b1 = [0,1,0]; }
    const cs = [[+MW/2,+ML/2],[-MW/2,+ML/2],[-MW/2,-ML/2],[+MW/2,-ML/2]].map(([uu, vv]) => {
      const X = m.x + a1[0]*uu + b1[0]*vv;
      const Y = m.y + a1[1]*uu + b1[1]*vv;
      const Z = MIRROR_H + a1[2]*uu + b1[2]*vv;
      return P([X - ss.s[0]*Z/sz, Y - ss.s[1]*Z/sz, 0]);
    });
    ctx.fillStyle = 'rgba(55,85,115,.16)';
    ctx.beginPath();
    cs.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
    ctx.closePath(); ctx.fill();
  }

  // 深度排序绘制：镜面体 / 入射光线 / 反射光线 / 塔
  const items = [];
  const qM = P([m.x, m.y, MIRROR_H]);
  // 支架按细切片判定与镜板的遮挡关系并合并同状态区间（同主场景逻辑）
  let cur = null;
  for (let zs = 0; zs < PED.ballZ; zs += PED.sliceH) {
    const z1s = Math.min(zs + PED.sliceH, PED.ballZ);
    const hidden = segHitsMirrorQuad(m, pose, C, [m.x, m.y, (zs + z1s) / 2]);
    if (cur && cur.hidden === hidden) { cur.z1 = z1s; }
    else { const r = { hidden, z0: zs, z1: z1s }; cur = r; items.push({ dep: hidden ? qM.dep + 1 : qM.dep - 1, draw: () => drawPedestalSpan(ctx, P, m, [ss.s[0], ss.s[1]], 24, r.z0, r.z1) }); }
  }
  // 圆球嵌在镜背中心（背面视角可见）：相机在镜背侧时画在镜面前，正面时被镜面遮挡
  const frontCamZ = pose ? ((C[0]-m.x)*pose.n[0] + (C[1]-m.y)*pose.n[1] + (C[2]-MIRROR_H)*pose.n[2]) > 0 : true;
  items.push({ dep: frontCamZ ? qM.dep + 1 : qM.dep - 1, draw: () => drawBall(ctx, P, m) });
  // 镜面体（含厚度、背面剔除，正面用槽位色；网格分片参照真实定日镜小镜片拼接）
  items.push({ dep: qM.dep, draw: () => {
    const a1 = pose ? norm(cross(pose.n, [0,0,1])) : [1,0,0];
    if (!isFinite(a1[0])) a1[0] = 1;
    const b1 = pose ? norm(cross(pose.n, a1)) : [0,1,0];
    const T = 0.4;
    const csW = pose ? [
      [m.x+a1[0]*MW/2+b1[0]*ML/2, m.y+a1[1]*MW/2+b1[1]*ML/2, MIRROR_H+a1[2]*MW/2+b1[2]*ML/2],
      [m.x-a1[0]*MW/2+b1[0]*ML/2, m.y-a1[1]*MW/2+b1[1]*ML/2, MIRROR_H-a1[2]*MW/2+b1[2]*ML/2],
      [m.x-a1[0]*MW/2-b1[0]*ML/2, m.y-a1[1]*MW/2-b1[1]*ML/2, MIRROR_H-a1[2]*MW/2-b1[2]*ML/2],
      [m.x+a1[0]*MW/2-b1[0]*ML/2, m.y+a1[1]*MW/2-b1[1]*ML/2, MIRROR_H+a1[2]*MW/2-b1[2]*ML/2],
    ] : [
      [m.x+MW/2, m.y+ML/2, MIRROR_H], [m.x-MW/2, m.y+ML/2, MIRROR_H],
      [m.x-MW/2, m.y-ML/2, MIRROR_H], [m.x+MW/2, m.y-ML/2, MIRROR_H],
    ];
    const cs = csW.map(P);
    const back = csW.map(c => P([c[0], c[1], c[2]-T]));
    // 背面与四个侧面（银灰白框架质感）+ 背面网格分片线
    ctx.fillStyle = '#c2c8cf'; ctx.strokeStyle = '#7d858f'; ctx.lineWidth = 1;
    ctx.beginPath();
    back.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
    ctx.closePath(); ctx.fill(); ctx.stroke();
    drawMirrorGrid(ctx, P, csW, PED.cols, PED.rows, 'rgba(110,120,132,.6)', 1.3, T);
    for (let j = 0; j < 4; j++) {
      const k2 = (j+1)%4;
      ctx.beginPath();
      ctx.moveTo(cs[j].x, cs[j].y); ctx.lineTo(cs[k2].x, cs[k2].y);
      ctx.lineTo(back[k2].x, back[k2].y); ctx.lineTo(back[j].x, back[j].y);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    if (pose) {
      const vx = C[0]-m.x, vy = C[1]-m.y, vz = C[2]-MIRROR_H;
      const seenFront = (vx*pose.n[0] + vy*pose.n[1] + vz*pose.n[2]) > 0;
      if (seenFront) {
        ctx.beginPath();
        cs.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
        ctx.closePath();
        ctx.fillStyle = '#4353c5'; ctx.fill();
        ctx.strokeStyle = SEL_COLORS[slot]; ctx.lineWidth = 5; ctx.stroke();
        drawMirrorGrid(ctx, P, csW, PED.cols, PED.rows, 'rgba(255,255,255,.5)', 1.6, 0);
        ctx.beginPath();
        ctx.moveTo(cs[0].x, cs[0].y); ctx.lineTo(cs[1].x, cs[1].y); ctx.lineTo(cs[2].x, cs[2].y);
        ctx.closePath(); ctx.fillStyle = 'rgba(190,225,255,.5)'; ctx.fill();
      } else {
        // 从背面看：银灰框架背面 + 槽位色描边标识选中 + 镜背中心的关节安装环
        ctx.strokeStyle = SEL_COLORS[slot]; ctx.lineWidth = 2.6;
        ctx.beginPath();
        back.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
        ctx.closePath(); ctx.stroke();
        ctx.beginPath();
        for (let k = 0; k <= 24; k++) {
          const a = k/24*2*Math.PI;
          const p3 = P([m.x + a1[0]*PED.ballR*Math.sin(a) + b1[0]*PED.ballR*Math.cos(a),
                        m.y + a1[1]*PED.ballR*Math.sin(a) + b1[1]*PED.ballR*Math.cos(a),
                        MIRROR_H - T/2 + a1[2]*PED.ballR*Math.sin(a) + b1[2]*PED.ballR*Math.cos(a)]);
          k ? ctx.lineTo(p3.x, p3.y) : ctx.moveTo(p3.x, p3.y);
        }
        ctx.fillStyle = 'rgba(190,198,206,.9)'; ctx.fill();
        ctx.strokeStyle = '#5a636e'; ctx.lineWidth = 1.6; ctx.stroke();
      }
    } else {
      ctx.beginPath();
      cs.forEach((c,j) => j ? ctx.lineTo(c.x,c.y) : ctx.moveTo(c.x,c.y));
      ctx.closePath();
      ctx.fillStyle = '#9db1c2'; ctx.fill();
      ctx.strokeStyle = '#5a7186'; ctx.lineWidth = 1.2; ctx.stroke();
      drawMirrorGrid(ctx, P, csW, PED.cols, PED.rows, 'rgba(255,255,255,.4)', 1.2, 0);
    }
  }});
  // 入射平行光线（太阳方向 → 镜心）与反射光线（镜心 → 吸热器中心）
  if (pose && ss.working) {
    // 相机在法线正侧（反光面一侧）时，两条光线均在镜面与相机之间，画在镜面之前；
    // 相机在背侧时，光线在镜面另一侧，画在镜面之后（被镜面正确遮挡）
    const frontCam = (C[0]-m.x)*pose.n[0] + (C[1]-m.y)*pose.n[1] + (C[2]-MIRROR_H)*pose.n[2] > 0;
    const rayDep = frontCam ? qM.dep - 1 : qM.dep + 1;
    // 线段近平面裁剪：端点在相机背后时投影会镜像失真，须在世界空间裁到 dep>2 再投影
    const NEAR = 2;
    const clipSeg = (A, B) => {
      const da = depOf(A), db = depOf(B);
      if (da < NEAR && db < NEAR) return null;
      let a = A, b = B;
      if (da < NEAR) { const t = (NEAR-da)/(db-da); a = [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t]; }
      if (db < NEAR) { const t = (NEAR-db)/(da-db); b = [A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t]; }
      return [P(a), P(b)];
    };
    const LEN = 90;
    const iSeg = clipSeg([m.x + ss.s[0]*LEN, m.y + ss.s[1]*LEN, MIRROR_H + ss.s[2]*LEN], [m.x, m.y, MIRROR_H]);
    if (iSeg) items.push({ dep: rayDep, draw: () => {
      ctx.strokeStyle = 'rgba(255,215,80,.95)'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(iSeg[0].x, iSeg[0].y); ctx.lineTo(iSeg[1].x, iSeg[1].y); ctx.stroke();
      ctx.lineCap = 'butt';
    }});
    const R = reflectDir([-ss.s[0], -ss.s[1], -ss.s[2]], pose.n);
    const distT = Math.hypot(m.x, m.y, REC_CENTER - MIRROR_H);
    const rSeg = clipSeg([m.x, m.y, MIRROR_H], [m.x + R[0]*distT, m.y + R[1]*distT, MIRROR_H + R[2]*distT]);
    if (rSeg) items.push({ dep: rayDep, draw: () => {
      // 反射光线：吸热器通常在特写画面外，光线延伸至画布边缘并以箭头+文字标注去向
      const p0 = rSeg[0], p1 = rSeg[1];
      const mx0 = 10;
      const dxl = p1.x - p0.x, dyl = p1.y - p0.y;
      let tEnd = 1;
      if (dxl < -1e-6) tEnd = Math.min(tEnd, (mx0 - p0.x)/dxl);
      if (dxl >  1e-6) tEnd = Math.min(tEnd, (W - mx0 - p0.x)/dxl);
      if (dyl < -1e-6) tEnd = Math.min(tEnd, (mx0 - p0.y)/dyl);
      if (dyl >  1e-6) tEnd = Math.min(tEnd, (H - mx0 - p0.y)/dyl);
      tEnd = Math.max(0.02, tEnd);
      const ex = p0.x + dxl*tEnd, ey = p0.y + dyl*tEnd;
      ctx.strokeStyle = 'rgba(255,180,30,.95)'; ctx.lineWidth = 4.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(ex, ey); ctx.stroke();
      ctx.lineCap = 'butt';
      // 边缘箭头 + 去向文字（吸热器在画面内时直接标在端点旁）
      const L = Math.hypot(dxl, dyl) || 1;
      const ux = dxl/L, uy = dyl/L;
      ctx.fillStyle = '#e59400';
      ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(ex + ux*13, ey + uy*13);
      ctx.lineTo(ex - ux*3 + uy*7, ey - uy*3 - ux*7);
      ctx.lineTo(ex - ux*3 - uy*7, ey - uy*3 + ux*7);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.font = 'bold 12px "Microsoft YaHei"';
      ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(255,255,255,.92)';
      const tx = Math.min(W - 108, Math.max(6, ex - ux*20 - (ux > 0.3 ? 92 : 0)));
      const ty = Math.min(H - 8, Math.max(14, ey - uy*16));
      ctx.strokeText('反射光→吸热器', tx, ty);
      ctx.fillText('反射光→吸热器', tx, ty);
    }});
  }
  // 中央吸热塔（背景）：收分圆台 + 黄色吸热器
  items.push({ dep: P([0, 0, TOWER_H*0.5]).dep, draw: () => {
    const sh = ss.elv > 3 ? norm([ss.s[0], ss.s[1], 0]) : null;
    drawCyl3D(ctx, P, 0, 0, 5.0, 1.9, 0, TOWER_H, '#e3ebf2', '#8fa2b2', null, sh);
    drawCyl3D(ctx, P, 0, 0, 4.0, 4.0, TOWER_H-0.6, TOWER_H, '#aeb9c4', null, '#c9d2da', sh);
    drawCyl3D(ctx, P, 0, 0, 5.2, 5.2, TOWER_H, TOWER_H + REC_H,
      ss.working ? '#ffc23d' : '#a7b2bc',
      ss.working ? '#e0a52e' : '#8b98a3',
      ss.working ? '#ffe28a' : '#c2ccd4', sh);
    if (ss.working) {
      const rec = P([0,0,REC_CENTER]);
      const glowR = 30*rec.k + 12;
      const rg = ctx.createRadialGradient(rec.x, rec.y, 2, rec.x, rec.y, glowR);
      rg.addColorStop(0,'rgba(255,235,140,.95)'); rg.addColorStop(0.4,'rgba(255,220,90,.45)'); rg.addColorStop(1,'rgba(255,220,90,0)');
      ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(rec.x, rec.y, glowR, 0, 2*Math.PI); ctx.fill();
    }
  }});
  items.sort((a, b) => b.dep - a.dep);
  items.forEach(o => o.draw());

  // 太阳（沿入射方向远端投影，须在相机前方才绘制）
  if (ss.elv > 0) {
    const sp = [m.x + ss.s[0]*150, m.y + ss.s[1]*150, MIRROR_H + ss.s[2]*150];
    if (depOf(sp) > 5) {
      const qs = P(sp);
      if (qs.x > -40 && qs.x < W+40 && qs.y > -40 && qs.y < H+40) drawSunIcon(ctx, qs.x, qs.y, 11);
    }
  }
  // 吸热器标注（须在相机前方才绘制）
  const rp = [0, 0, TOWER_H + REC_H];
  if (depOf(rp) > 5) {
    const recL = P(rp);
    if (recL.x > -60 && recL.x < W+60 && recL.y > -40 && recL.y < H+40) {
      ctx.font = 'bold 12px "Microsoft YaHei"';
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.9)';
      ctx.strokeText('吸热器', recL.x + 10, recL.y - 6);
      ctx.fillStyle = '#c07b00'; ctx.fillText('吸热器', recL.x + 10, recL.y - 6);
    }
  }
  // 左上角信息
  const p = poseAt(state.sel[slot], state.timeMin);
  ctx.font = 'bold 13px "Microsoft YaHei"';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineJoin = 'round';
  const info = `镜${slot+1} ${m.id}　${isNaN(p.tilt) ? '停用（水平放置）' : `仰角 ${p.tilt.toFixed(1)}°　方位角 ${p.face.toFixed(1)}°`}`;
  ctx.strokeText(info, 10, 20);
  ctx.fillStyle = SEL_COLORS[slot]; ctx.fillText(info, 10, 20);
  // 操作提示（右下角）
  ctx.font = '10px "Microsoft YaHei"';
  ctx.textAlign = 'right';
  ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(255,255,255,.85)';
  const hintZ = state.zoomCam[slot]
    ? `视角 方位${(((state.zoomCam[slot].azi%360)+360)%360).toFixed(0)}° 俯角${state.zoomCam[slot].elv.toFixed(0)}°　拖动旋转 · 滚轮缩放 · 双击复位`
    : '拖动旋转视角 · 滚轮缩放 · 双击复位';
  ctx.strokeText(hintZ, W - 8, H - 8);
  ctx.fillStyle = '#527a99'; ctx.fillText(hintZ, W - 8, H - 8);
  ctx.textAlign = 'left';
}

// 播放控制
function setBtns() {
  document.getElementById('bPlay').textContent = state.playing ? '\u25B6 播放中…' : '\u25B6 播放一天';
}
document.getElementById('bPlay').onclick = () => { state.playing = true; setBtns(); };
document.getElementById('bPause').onclick = () => { state.playing = false; setBtns(); };
document.getElementById('bStop').onclick = () => { state.playing = false; state.timeMin = 600; document.getElementById('time').value = 600; setBtns(); update(); };

// 视角拖拽 / 滚轮缩放
let drag = null;
const sc = document.getElementById('scene');
const elvSlider = document.getElementById('elvSlider');
const elvVal = document.getElementById('elvVal');
function setElvUI() { elvSlider.value = Math.round(state.viewElv); elvVal.textContent = Math.round(state.viewElv) + '°'; }
elvSlider.addEventListener('input', e => {
  state.viewElv = +e.target.value;
  elvVal.textContent = Math.round(state.viewElv) + '°';
  drawScene();
});
setElvUI();
sc.addEventListener('mousedown', e => drag = { x: e.clientX, y: e.clientY });
window.addEventListener('mousemove', e => {
  if (!drag) return;
  state.viewAzi += (e.clientX - drag.x) * 0.3;
  state.viewElv = Math.min(90, Math.max(-15, state.viewElv + (e.clientY - drag.y) * 0.2));
  setElvUI();
  drag = { x: e.clientX, y: e.clientY };
  drawScene();
});
window.addEventListener('mouseup', () => drag = null);
sc.addEventListener('wheel', e => {
  e.preventDefault();
  state.zoom = Math.min(4, Math.max(0.4, state.zoom * (e.deltaY < 0 ? 1.12 : 1/1.12)));
  drawScene();
}, { passive: false });

// 动画循环：一天 48 秒
let lastT = performance.now();
function loop(now) {
  const dt = (now - lastT)/1000; lastT = now;
  if (state.playing) {
    state.timeMin = (state.timeMin + dt*30) % 1440;
    document.getElementById('time').value = state.timeMin;
    update();
  }
  requestAnimationFrame(loop);
}
if (window.ResizeObserver) {
  new ResizeObserver(() => drawScene()).observe(document.getElementById('sceneWrap'));
  new ResizeObserver(() => { drawPlan(); drawChart(); }).observe(document.getElementById('rightPanel'));
}
window.addEventListener('resize', update);
update();
requestAnimationFrame(loop);
setBtns();
</script>
</body>
</html>
